<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#faf4e8;--card:#fff;--ink:#4a3322;--mut:#8a7560;--line:#eadcc0;--acc:#e8a63a;--acc2:#c98412;--bad:#b3392f;--ok:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tajawal,Tahoma,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:5}
.bar b{margin-inline-end:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font:inherit;color:var(--ink);cursor:pointer}
.tab.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-size:34px;color:var(--acc2)}
.stat small{color:var(--mut)}
label{display:block;margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:500;background:var(--acc);color:#fff;cursor:pointer}
.btn.g{background:#efe3c8;color:var(--ink)}
.btn.d{background:var(--bad)}
.btn.s{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.f{flex:1;min-width:140px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.item:last-child{border:0}
.tag{white-space:nowrap;font-size:13px;border-radius:999px;padding:2px 10px;background:#efe3c8}
.tag.p{background:#d9efe0;color:var(--ok)}
.mf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:8px}
.mf img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.mf audio{height:34px;max-width:200px}
.pg{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fffdf8}
.ovl{position:fixed;inset:0;background:rgba(60,40,20,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.ovl .box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:820px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.m{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;background:#fffdf8;cursor:pointer;overflow:hidden;word-break:break-word}
.m img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.m .ico{height:90px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mut)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:50;display:none}
#toast.bad{background:var(--bad)}
.login{max-width:380px;margin:12vh auto}
.err{color:var(--bad);min-height:1.4em}
.mut{color:var(--mut);font-size:14px}
td select{min-width:100px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C = window.LW_CONFIG || {};
const $ = s => document.querySelector(s);
const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb = null, M = {}, SIGNED = {}, TAB = 'dash', ED = null, PK = null;
const TABS = [['dash','لوحة التحكم'],['stories','القصص'],['acts','الأنشطة'],['plans','الخطط الشهرية'],['games','الألعاب'],['media','المكتبة'],['subs','المشتركات']];
const MIME = {mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',ogg:'audio/ogg',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',pdf:'application/pdf'};

function toast(m, bad) {
  const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', bad ? 5000 : 2200);
}
function fail(err) {
  const m = String((err && err.message) || err || '');
  if (/duplicate key|unique/i.test(m)) toast('هذه القيمة مكررة (مثلاً: الشهر موجود مسبقاً)', 1);
  else if (/row-level security|permission/i.test(m)) toast('ليس لديك صلاحية لهذه العملية', 1);
  else toast('تعذّر الحفظ: ' + m, 1);
  console.error(err);
}

/* ---------- start / login ---------- */
async function boot() {
  if (!C.url || /YOUR-/.test(C.url) || !window.supabase) {
    $('#app').innerHTML = '<div class="wrap"><div class="card"><h2>لم يتم الضبط بعد</h2><p>املئي ملف config.js بعنوان المشروع والمفتاح العام (انظري SETUP.md).</p></div></div>';
    return;
  }
  sb = supabase.createClient(C.url, C.anonKey);
  const { data } = await sb.auth.getSession();
  data.session ? enter() : loginView();
}
function loginView(err) {
  $('#app').innerHTML = `<div class="wrap"><form class="card login" onsubmit="login(event)">
  <h2>دخول المدير</h2>
  <label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username" required>
  <label>كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password" required>
  <p class="err">${e(err || '')}</p><button class="btn" style="width:100%">دخول</button></form></div>`;
}
async function login(ev) {
  ev.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) return loginView('بيانات الدخول غير صحيحة');
  enter();
}
async function enter() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return loginView();
  // The database decides who is admin. A normal mother account gets no row here.
  const { data: a } = await sb.from('admins').select('user_id').eq('user_id', user.id).maybeSingle();
  if (!a) { await sb.auth.signOut(); return loginView('هذا الحساب ليس حساب المدير'); }
  await loadMedia();
  $('#app').innerHTML = `<div class="bar"><b>لوحة الإدارة</b>${TABS.map(t => `<button class="tab" id="t_${t[0]}" onclick="show('${t[0]}')">${t[1]}</button>`).join('')}<button class="btn g s" onclick="out()">خروج</button></div><div class="wrap" id="main"></div>`;
  show('dash');
}
async function out() { await sb.auth.signOut(); loginView(); }
function show(t) {
  TAB = t; ED = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.id === 't_' + t));
  ({ dash: vDash, stories: vStories, acts: vActs, plans: vPlans, games: vGames, media: vMedia, subs: vSubs })[t]();
}
const main = h => $('#main').innerHTML = h;

/* ---------- media helpers ---------- */
async function loadMedia() {
  const { data } = await sb.from('media').select('*').order('created_at', { ascending: false });
  M = {}; (data || []).forEach(r => M[r.id] = r);
  SIGNED = {};
  const priv = Object.values(M).filter(r => r.bucket === 'media-private');
  if (priv.length) {
    const { data: s } = await sb.storage.from('media-private').createSignedUrls(priv.map(r => r.path), 3600);
    (s || []).forEach(x => { const r = priv.find(p => p.path === x.path); if (r && x.signedUrl) SIGNED[r.id] = x.signedUrl; });
  }
}
const murl = r => !r ? '' : r.bucket === 'media-public' ? sb.storage.from('media-public').getPublicUrl(r.path).data.publicUrl : (SIGNED[r.id] || '');
async function upl(file, priv) {
  const ext = (file.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const mime = file.type || MIME[ext] || '';
  const kind = mime.startsWith('image/') ? 'image' : mime.startsWith('audio/') ? 'audio' : mime === 'application/pdf' ? 'pdf' : null;
  if (!kind) throw new Error('نوع الملف غير مدعوم: ' + file.name);
  if (file.size > 20 * 1024 * 1024) throw new Error('الملف أكبر من 20 ميغابايت: ' + file.name);
  const bucket = priv ? 'media-private' : 'media-public';
  const path = `${kind}/${crypto.randomUUID()}.${ext || 'bin'}`;
  const up = await sb.storage.from(bucket).upload(path, file, { contentType: mime, upsert: false });
  if (up.error) throw up.error;
  const { data, error } = await sb.from('media').insert({ kind, bucket, path, name: file.name, mime, size_bytes: file.size }).select().single();
  if (error) { await sb.storage.from(bucket).remove([path]); throw error; }
  M[data.id] = data;
  if (priv) await loadMedia();
  return data;
}
const ICO = { image: 'صورة', audio: 'صوت', pdf: 'PDF' };
function thumb(r) {
  if (!r) return '';
  return r.kind === 'image' && murl(r) ? `<img src="${e(murl(r))}" alt="">` : `<div class="ico">${ICO[r.kind]}</div>`;
}
function setPath(p, v) { const k = p.split('.'); let o = ED; while (k.length > 1) o = o[k.shift()]; o[k[0]] = v; }
function mf(path, kind, val) {
  const r = M[val];
  const prev = !r ? '<span class="mut">لا يوجد</span>' : r.kind === 'image' ? `<img src="${e(murl(r))}" alt="">` : r.kind === 'audio' ? `<audio controls preload="none" src="${e(murl(r))}"></audio>` : `<a href="${e(murl(r))}" target="_blank" rel="noopener">${e(r.name)}</a>`;
  return `<div class="mf">${prev}<button type="button" class="btn g s" onclick="pickFor('${path}','${kind}')">اختيار من المكتبة / رفع</button>${r ? `<button type="button" class="btn g s" onclick="clr('${path}')">إزالة</button>` : ''}</div>`;
}
function clr(p) { setPath(p, null); redraw(); }
function pickFor(path, kind) { PK = kind === 'pdfimg' ? { path, kind: 'pdf', kinds: ['pdf', 'image'] } : { path, kind }; pickView(); }
function pickView() {
  const list = Object.values(M).filter(r => PK.kinds ? PK.kinds.includes(r.kind) : r.kind === PK.kind);
  let o = document.getElementById('ovl'); if (!o) { o = document.createElement('div'); o.id = 'ovl'; o.className = 'ovl'; document.body.appendChild(o); }
  o.innerHTML = `<div class="box"><div class="row"><h3 style="margin:0;flex:1">المكتبة</h3><button class="btn g s" onclick="pickClose()">إغلاق</button></div>
  <div class="row" style="margin:10px 0"><input type="file" id="pf" multiple style="flex:1" accept="${PK.kind === 'image' ? 'image/*' : PK.kind === 'audio' ? 'audio/*' : 'application/pdf,image/*'}"><label style="margin:0"><input type="checkbox" id="pp"> ملف خاص</label><button class="btn s" onclick="pickUpload()">رفع</button></div>
  <div class="lib">${list.map(r => `<div class="m" onclick="pickSet('${r.id}')">${thumb(r)}${e(r.name)}</div>`).join('') || '<p class="mut">المكتبة فارغة لهذا النوع، ارفعي ملفاً.</p>'}</div></div>`;
}
function pickClose() { const o = document.getElementById('ovl'); if (o) o.remove(); PK = null; }
async function pickUpload() {
  const fs = [...$('#pf').files]; if (!fs.length) return toast('اختاري ملفاً أولاً', 1);
  try { for (const f of fs) await upl(f, $('#pp').checked); toast('تم الرفع'); pickView(); } catch (x) { fail(x); }
}
function pickSet(id) { if (PK.path) { setPath(PK.path, id); redraw(); } pickClose(); }
function redraw() { ({ stories: edStory, acts: edAct, plans: edPlan, games: edGame })[TAB](); }
const bind = (path, el) => setPath(path, el.type === 'number' ? Number(el.value) : el.value);
const inp = (path, val, type = 'text', extra = '') => `<input type="${type}" value="${e(val)}" ${extra} oninput="bind('${path}',this)">`;
const area = (path, val) => `<textarea oninput="bind('${path}',this)">${e(val)}</textarea>`;
const statusSel = v => `<select onchange="bind('status',this)"><option value="draft" ${v === 'draft' ? 'selected' : ''}>مسودة (لا تظهر للأمهات)</option><option value="published" ${v === 'published' ? 'selected' : ''}>منشورة</option></select>`;
const tagS = s => `<span class="tag ${s === 'published' ? 'p' : ''}">${s === 'published' ? 'منشورة' : 'مسودة'}</span>`;
const ok = m => confirm(m);

/* ---------- dashboard ---------- */
async function vDash() {
  main('<p class="mut">جاري التحميل...</p>');
  const c = async (t, f) => { let q = sb.from(t).select('*', { count: 'exact', head: true }); if (f) q = f(q); const { count } = await q; return count ?? 0; };
  const [s, sp, a, ap, g, gp, p, pp, sub, act] = await Promise.all([
    c('stories'), c('stories', q => q.eq('status', 'published')), c('activities'), c('activities', q => q.eq('status', 'published')),
    c('games'), c('games', q => q.eq('status', 'published')), c('plans'), c('plans', q => q.eq('status', 'published')),
    c('subscribers'), c('subscribers', q => q.eq('status', 'active'))]);
  const st = (n, l, x) => `<div class="stat"><b>${n}</b>${l}<br><small>${x}</small></div>`;
  main(`<h2>لوحة التحكم</h2><div class="grid">${st(s, 'القصص', sp + ' منشورة')}${st(a, 'الأنشطة', ap + ' منشورة')}${st(g, 'الألعاب', gp + ' منشورة')}${st(p, 'الخطط الشهرية', pp + ' منشورة')}${st(Object.keys(M).length, 'ملفات المكتبة', '')}${st(sub, 'الأمهات', act + ' مشتركة فعّالة')}</div>`);
}

/* ---------- stories ---------- */
async function vStories() {
  const { data, error } = await sb.from('stories').select('id,title,status,cover_id').order('created_at', { ascending: false });
  if (error) return fail(error);
  main(`<div class="row"><h2 style="flex:1;margin:0">القصص</h2><button class="btn" onclick="newStory()">قصة جديدة</button></div><div class="card">${(data || []).map(s => `<div class="item"><span class="row">${thumb(M[s.cover_id]) ? `<span style="width:48px">${thumb(M[s.cover_id])}</span>` : ''}<b>${e(s.title)}</b> ${tagS(s.status)}</span><span class="row"><button class="btn g s" onclick="editStory('${s.id}')">تعديل</button><button class="btn d s" onclick="delRow('stories','${s.id}')">حذف</button></span></div>`).join('') || '<p class="mut">لا توجد قصص بعد.</p>'}</div>`);
}
function newStory() { ED = { title: '', summary: '', status: 'draft', cover_id: null, pages: [{ body: '', image_id: null, audio_id: null }] }; edStory(); }
async function editStory(id) {
  const [{ data: s }, { data: p }] = await Promise.all([sb.from('stories').select('*').eq('id', id).single(), sb.from('story_pages').select('*').eq('story_id', id).order('position')]);
  ED = { id, title: s.title, summary: s.summary || '', status: s.status, cover_id: s.cover_id, pages: (p || []).map(x => ({ body: x.body || '', image_id: x.image_id, audio_id: x.audio_id })) };
  edStory();
}
function edStory() {
  const d = ED;
  main(`<h2>${d.id ? 'تعديل قصة' : 'قصة جديدة'}</h2><div class="card">
  <label>عنوان القصة</label>${inp('title', d.title)}
  <label>وصف قصير (للأم)</label>${area('summary', d.summary)}
  <label>صورة الغلاف</label>${mf('cover_id', 'image', d.cover_id)}
  <label>الحالة</label>${statusSel(d.status)}</div>
  <h3>صفحات القصة</h3>${d.pages.map((p, i) => `<div class="pg"><div class="row"><b style="flex:1">صفحة ${i + 1}</b>
   <button class="btn g s" onclick="mvPage(${i},-1)">أعلى</button><button class="btn g s" onclick="mvPage(${i},1)">أسفل</button><button class="btn d s" onclick="rmPage(${i})">حذف</button></div>
   <label>النص</label>${area('pages.' + i + '.body', p.body)}
   <label>الرسمة</label>${mf('pages.' + i + '.image_id', 'image', p.image_id)}
   <label>التسجيل الصوتي</label>${mf('pages.' + i + '.audio_id', 'audio', p.audio_id)}</div>`).join('')}
  <div class="row"><button class="btn g" onclick="addPage()">إضافة صفحة</button><span style="flex:1"></span><button class="btn g" onclick="show('stories')">إلغاء</button><button class="btn" onclick="saveStory()">حفظ</button></div>`);
}
const addPage = () => { ED.pages.push({ body: '', image_id: null, audio_id: null }); edStory(); };
const rmPage = i => { if (ok('حذف هذه الصفحة؟')) { ED.pages.splice(i, 1); edStory(); } };
const mvPage = (i, d) => { const j = i + d; if (j < 0 || j >= ED.pages.length) return; [ED.pages[i], ED.pages[j]] = [ED.pages[j], ED.pages[i]]; edStory(); };
async function saveStory() {
  const d = ED; if (!d.title.trim()) return toast('اكتبي عنوان القصة', 1);
  const row = { title: d.title.trim(), summary: d.summary || null, status: d.status, cover_id: d.cover_id || null };
  let id = d.id;
  if (id) { const { error } = await sb.from('stories').update(row).eq('id', id); if (error) return fail(error); }
  else { const { data, error } = await sb.from('stories').insert(row).select('id').single(); if (error) return fail(error); id = data.id; }
  let r = await sb.from('story_pages').delete().eq('story_id', id); if (r.error) return fail(r.error);
  if (d.pages.length) { r = await sb.from('story_pages').insert(d.pages.map((p, i) => ({ story_id: id, position: i + 1, body: p.body || null, image_id: p.image_id || null, audio_id: p.audio_id || null }))); if (r.error) return fail(r.error); }
  toast('تم الحفظ'); show('stories');
}
async function delRow(t, id) {
  if (!ok('حذف نهائي؟ لا يمكن التراجع.')) return;
  const { error } = await sb.from(t).delete().eq('id', id); if (error) return fail(error);
  toast('تم الحذف'); show(TAB);
}

/* ---------- activities ---------- */
const KINDS = { printable: 'ورقة للطباعة', coloring: 'تلوين', craft: 'عمل يدوي', game: 'لعب', other: 'أخرى' };
async function vActs() {
  const { data, error } = await sb.from('activities').select('id,title,status,kind').order('created_at', { ascending: false });
  if (error) return fail(error);
  main(`<div class="row"><h2 style="flex:1;margin:0">الأنشطة</h2><button class="btn" onclick="newAct()">نشاط جديد</button></div><div class="card">${(data || []).map(a => `<div class="item"><span><b>${e(a.title)}</b> ${tagS(a.status)} <span class="tag">${KINDS[a.kind] || ''}</span></span><span class="row"><button class="btn g s" onclick="editAct('${a.id}')">تعديل</button><button class="btn d s" onclick="delRow('activities','${a.id}')">حذف</button></span></div>`).join('') || '<p class="mut">لا توجد أنشطة بعد.</p>'}</div>`);
}
async function planList() { const { data } = await sb.from('plans').select('id,month_no,title,activity_count').order('month_no'); return data || []; }
async function newAct() { ED = { title: '', description: '', kind: 'printable', status: 'draft', file_id: null, plans: [], _plans: await planList(), _counts: {} }; edAct(); }
async function editAct(id) {
  const [{ data: a }, { data: pa }, pl, { data: all }] = await Promise.all([sb.from('activities').select('*').eq('id', id).single(), sb.from('plan_activities').select('plan_id').eq('activity_id', id), planList(), sb.from('plan_activities').select('plan_id')]);
  const counts = {}; (all || []).forEach(x => counts[x.plan_id] = (counts[x.plan_id] || 0) + 1);
  ED = { id, title: a.title, description: a.description || '', kind: a.kind, status: a.status, file_id: a.file_id, plans: (pa || []).map(x => x.plan_id), _plans: pl, _counts: counts };
  edAct();
}
function edAct() {
  const d = ED;
  main(`<h2>${d.id ? 'تعديل نشاط' : 'نشاط جديد'}</h2><div class="card">
  <label>عنوان النشاط</label>${inp('title', d.title)}
  <label>الوصف / التعليمات للأم</label>${area('description', d.description)}
  <label>النوع</label><select onchange="bind('kind',this)">${Object.entries(KINDS).map(k => `<option value="${k[0]}" ${d.kind === k[0] ? 'selected' : ''}>${k[1]}</option>`).join('')}</select>
  <label>الملف القابل للطباعة (PDF أو صورة)</label>${mf('file_id', 'pdfimg', d.file_id)}
  <label>الحالة</label>${statusSel(d.status)}
  <label>إسناد النشاط إلى الاشتراكات الشهرية</label>
  ${d._plans.length ? d._plans.map(p => `<label style="font-weight:400"><input type="checkbox" ${d.plans.includes(p.id) ? 'checked' : ''} onchange="togPlan('${p.id}',this.checked)"> الشهر ${p.month_no}: ${e(p.title)} <span class="mut">(مسموح ${p.activity_count} أنشطة)</span></label>`).join('') : '<p class="mut">أنشئي خطة شهرية أولاً.</p>'}
  </div><div class="row"><span style="flex:1"></span><button class="btn g" onclick="show('acts')">إلغاء</button><button class="btn" onclick="saveAct()">حفظ</button></div>`);
}
const togPlan = (id, on) => { ED.plans = ED.plans.filter(x => x !== id); if (on) ED.plans.push(id); };
async function saveAct() {
  const d = ED; if (!d.title.trim()) return toast('اكتبي عنوان النشاط', 1);
  const row = { title: d.title.trim(), description: d.description || null, kind: d.kind, status: d.status, file_id: d.file_id || null };
  let id = d.id;
  if (id) { const { error } = await sb.from('activities').update(row).eq('id', id); if (error) return fail(error); }
  else { const { data, error } = await sb.from('activities').insert(row).select('id').single(); if (error) return fail(error); id = data.id; }
  let r = await sb.from('plan_activities').delete().eq('activity_id', id); if (r.error) return fail(r.error);
  if (d.plans.length) { r = await sb.from('plan_activities').insert(d.plans.map(p => ({ plan_id: p, activity_id: id, position: 0 }))); if (r.error) return fail(r.error); }
  toast('تم الحفظ'); show('acts');
}

/* ---------- monthly plans ---------- */
async function vPlans() {
  const { data, error } = await sb.from('plans').select('id,month_no,title,status,activity_count').order('month_no');
  if (error) return fail(error);
  main(`<div class="row"><h2 style="flex:1;margin:0">الخطط الشهرية</h2><button class="btn" onclick="newPlan()">خطة جديدة</button></div><div class="card">${(data || []).map(p => `<div class="item"><span><b>الشهر ${p.month_no}</b> — ${e(p.title)} ${tagS(p.status)} <span class="tag">${p.activity_count} أنشطة</span></span><span class="row"><button class="btn g s" onclick="editPlan('${p.id}')">تعديل</button><button class="btn d s" onclick="delRow('plans','${p.id}')">حذف</button></span></div>`).join('') || '<p class="mut">لا توجد خطط بعد.</p>'}</div>`);
}
async function planRefs() {
  const [{ data: st }, { data: ac }] = await Promise.all([sb.from('stories').select('id,title,status').order('title'), sb.from('activities').select('id,title,status').order('title')]);
  return { st: st || [], ac: ac || [] };
}
async function newPlan() {
  const [{ data: last }, refs] = await Promise.all([sb.from('plans').select('month_no').order('month_no', { ascending: false }).limit(1), planRefs()]);
  ED = { title: '', theme: '', description: '', month_no: (last && last[0] ? last[0].month_no : 0) + 1, activity_count: 4, status: 'draft', guide_id: null, stories: [null, null, null], acts: [], _r: refs }; edPlan();
}
async function editPlan(id) {
  const [{ data: p }, { data: ps }, { data: pa }, refs] = await Promise.all([sb.from('plans').select('*').eq('id', id).single(), sb.from('plan_stories').select('*').eq('plan_id', id), sb.from('plan_activities').select('activity_id').eq('plan_id', id), planRefs()]);
  const stories = [null, null, null]; (ps || []).forEach(x => stories[x.position - 1] = x.story_id);
  ED = { id, title: p.title, theme: p.theme || '', description: p.description || '', month_no: p.month_no, activity_count: p.activity_count, status: p.status, guide_id: p.guide_id, stories, acts: (pa || []).map(x => x.activity_id), _r: refs }; edPlan();
}
function edPlan() {
  const d = ED, r = d._r;
  main(`<h2>${d.id ? 'تعديل خطة' : 'خطة شهرية جديدة'}</h2><div class="card">
  <div class="row"><div class="f"><label>رقم الشهر (1 = أول شهر من اشتراك الأم)</label>${inp('month_no', d.month_no, 'number', 'min="1"')}</div>
  <div class="f"><label>عدد الأنشطة في الشهر</label><input type="number" min="0" max="60" value="${d.activity_count}" oninput="setCount(this.value)"></div></div>
  <label>عنوان الشهر</label>${inp('title', d.title)}
  <label>الموضوع</label>${inp('theme', d.theme)}
  <label>وصف للأم</label>${area('description', d.description)}
  <label>دليل توزيع الشهر للأم (PDF)</label>${mf('guide_id', 'pdf', d.guide_id)}
  <label>الحالة</label>${statusSel(d.status)}</div>
  <div class="card"><h3>قصص الشهر الثلاث</h3>
  ${[0, 1, 2].map(i => `<label>القصة ${i + 1}</label><select onchange="setStory(${i},this.value)"><option value="">— اختاري —</option>${r.st.map(s => `<option value="${s.id}" ${d.stories[i] === s.id ? 'selected' : ''}>${e(s.title)}${s.status !== 'published' ? ' (مسودة)' : ''}</option>`).join('')}</select>`).join('')}
  </div><div class="card"><h3>أنشطة الشهر <span class="tag" dir="ltr" id="cnt">${d.acts.length} / ${d.activity_count}</span></h3>
  ${r.ac.map(a => `<label style="font-weight:400"><input type="checkbox" ${d.acts.includes(a.id) ? 'checked' : ''} onchange="togAct('${a.id}',this)"> ${e(a.title)}${a.status !== 'published' ? ' <span class="mut">(مسودة)</span>' : ''}</label>`).join('') || '<p class="mut">لا توجد أنشطة بعد.</p>'}
  </div><div class="row"><span style="flex:1"></span><button class="btn g" onclick="show('plans')">إلغاء</button><button class="btn" onclick="savePlan()">حفظ</button></div>`);
}
const setCount = v => { ED.activity_count = Math.max(0, Math.min(60, Number(v) || 0)); $('#cnt').textContent = ED.acts.length + ' / ' + ED.activity_count; };
const setStory = (i, v) => { ED.stories[i] = v || null; };
function togAct(id, el) {
  if (el.checked && ED.acts.length >= ED.activity_count) { el.checked = false; return toast('وصلتِ للحد الأقصى من الأنشطة لهذا الشهر', 1); }
  ED.acts = ED.acts.filter(x => x !== id); if (el.checked) ED.acts.push(id);
  $('#cnt').textContent = ED.acts.length + ' / ' + ED.activity_count;
}
async function savePlan() {
  const d = ED; if (!d.title.trim()) return toast('اكتبي عنوان الشهر', 1);
  if (!(d.month_no >= 1)) return toast('رقم الشهر يجب أن يكون 1 أو أكثر', 1);
  const picked = d.stories.filter(Boolean); if (new Set(picked).size !== picked.length) return toast('لا تكرري نفس القصة في الشهر', 1);
  if (d.acts.length > d.activity_count) return toast('عدد الأنشطة المختارة أكبر من العدد المحدد', 1);
  const row = { month_no: d.month_no, title: d.title.trim(), theme: d.theme || null, description: d.description || null, activity_count: d.activity_count, guide_id: d.guide_id || null, status: d.status };
  let id = d.id;
  if (id) { const { error } = await sb.from('plans').update(row).eq('id', id); if (error) return fail(error); }
  else { const { data, error } = await sb.from('plans').insert(row).select('id').single(); if (error) return fail(error); id = data.id; }
  let r = await sb.from('plan_stories').delete().eq('plan_id', id); if (r.error) return fail(r.error);
  const ps = d.stories.map((s, i) => s ? { plan_id: id, story_id: s, position: i + 1 } : null).filter(Boolean);
  if (ps.length) { r = await sb.from('plan_stories').insert(ps); if (r.error) return fail(r.error); }
  r = await sb.from('plan_activities').delete().eq('plan_id', id); if (r.error) return fail(r.error);
  if (d.acts.length) { r = await sb.from('plan_activities').insert(d.acts.map((a, i) => ({ plan_id: id, activity_id: a, position: i }))); if (r.error) return fail(r.error); }
  toast('تم الحفظ'); show('plans');
}

/* ---------- games ---------- */
async function vGames() {
  const { data, error } = await sb.from('games').select('id,title,status').order('created_at', { ascending: false });
  if (error) return fail(error);
  main(`<div class="row"><h2 style="flex:1;margin:0">الألعاب</h2><button class="btn" onclick="newGame()">لعبة جديدة</button></div><div class="card">${(data || []).map(g => `<div class="item"><span><b>${e(g.title)}</b> ${tagS(g.status)}</span><span class="row"><button class="btn g s" onclick="editGame('${g.id}')">تعديل</button><button class="btn d s" onclick="delRow('games','${g.id}')">حذف</button></span></div>`).join('') || '<p class="mut">لا توجد ألعاب بعد.</p>'}</div>`);
}
const blankQ = () => ({ prompt: '', image_id: null, audio_id: null, answers: [{ text: '', image_id: null }, { text: '', image_id: null }], correct_index: 0 });
function newGame() { ED = { title: '', description: '', status: 'draft', qs: [blankQ()] }; edGame(); }
async function editGame(id) {
  const [{ data: g }, { data: q }] = await Promise.all([sb.from('games').select('*').eq('id', id).single(), sb.from('game_questions').select('*').eq('game_id', id).order('position')]);
  ED = { id, title: g.title, description: g.description || '', status: g.status, qs: (q || []).map(x => ({ prompt: x.prompt, image_id: x.image_id, audio_id: x.audio_id, answers: x.answers.map(a => ({ text: a.text || '', image_id: a.image_id || null })), correct_index: x.correct_index })) };
  edGame();
}
function edGame() {
  const d = ED;
  main(`<h2>${d.id ? 'تعديل لعبة' : 'لعبة جديدة'}</h2><div class="card">
  <label>اسم اللعبة</label>${inp('title', d.title)}
  <label>وصف</label>${area('description', d.description)}
  <label>الحالة</label>${statusSel(d.status)}</div>
  <h3>الأسئلة</h3>${d.qs.map((q, i) => `<div class="pg"><div class="row"><b style="flex:1">سؤال ${i + 1}</b><button class="btn g s" onclick="mvQ(${i},-1)">أعلى</button><button class="btn g s" onclick="mvQ(${i},1)">أسفل</button><button class="btn d s" onclick="rmQ(${i})">حذف</button></div>
  <label>نص السؤال</label>${inp('qs.' + i + '.prompt', q.prompt)}
  <label>صورة السؤال (اختياري)</label>${mf('qs.' + i + '.image_id', 'image', q.image_id)}
  <label>تسجيل صوتي للسؤال (اختياري، وإلا يقرأه الجهاز)</label>${mf('qs.' + i + '.audio_id', 'audio', q.audio_id)}
  <label>الإجابات (اختاري الصحيحة)</label>
  ${q.answers.map((a, j) => `<div class="row" style="margin:6px 0"><input type="radio" name="c${i}" ${q.correct_index === j ? 'checked' : ''} onchange="ED.qs[${i}].correct_index=${j}"><div class="f">${inp('qs.' + i + '.answers.' + j + '.text', a.text, 'text', 'placeholder="نص الإجابة"')}</div><div>${mf('qs.' + i + '.answers.' + j + '.image_id', 'image', a.image_id)}</div><button class="btn d s" onclick="rmA(${i},${j})">حذف</button></div>`).join('')}
  <button class="btn g s" onclick="addA(${i})">إضافة إجابة</button></div>`).join('')}
  <div class="row"><button class="btn g" onclick="addQ()">إضافة سؤال</button><span style="flex:1"></span><button class="btn g" onclick="show('games')">إلغاء</button><button class="btn" onclick="saveGame()">حفظ</button></div>`);
}
const addQ = () => { ED.qs.push(blankQ()); edGame(); };
const rmQ = i => { if (ok('حذف السؤال؟')) { ED.qs.splice(i, 1); edGame(); } };
const mvQ = (i, d) => { const j = i + d; if (j < 0 || j >= ED.qs.length) return; [ED.qs[i], ED.qs[j]] = [ED.qs[j], ED.qs[i]]; edGame(); };
const addA = i => { if (ED.qs[i].answers.length >= 6) return toast('الحد الأقصى 6 إجابات', 1); ED.qs[i].answers.push({ text: '', image_id: null }); edGame(); };
const rmA = (i, j) => { const q = ED.qs[i]; if (q.answers.length <= 2) return toast('يلزم إجابتان على الأقل', 1); q.answers.splice(j, 1); if (q.correct_index >= q.answers.length) q.correct_index = 0; else if (j < q.correct_index) q.correct_index--; edGame(); };
async function saveGame() {
  const d = ED; if (!d.title.trim()) return toast('اكتبي اسم اللعبة', 1);
  for (const [i, q] of d.qs.entries()) {
    if (!q.prompt.trim()) return toast('السؤال ' + (i + 1) + ' بلا نص', 1);
    if (q.answers.some(a => !a.text.trim() && !a.image_id)) return toast('السؤال ' + (i + 1) + ' فيه إجابة فارغة', 1);
  }
  const row = { title: d.title.trim(), description: d.description || null, status: d.status };
  let id = d.id;
  if (id) { const { error } = await sb.from('games').update(row).eq('id', id); if (error) return fail(error); }
  else { const { data, error } = await sb.from('games').insert(row).select('id').single(); if (error) return fail(error); id = data.id; }
  let r = await sb.from('game_questions').delete().eq('game_id', id); if (r.error) return fail(r.error);
  if (d.qs.length) {
    r = await sb.from('game_questions').insert(d.qs.map((q, i) => ({ game_id: id, position: i + 1, prompt: q.prompt.trim(), image_id: q.image_id || null, audio_id: q.audio_id || null, answers: q.answers.map(a => ({ text: a.text.trim(), image_id: a.image_id || null })), correct_index: q.correct_index })));
    if (r.error) return fail(r.error);
  }
  toast('تم الحفظ'); show('games');
}

/* ---------- media library ---------- */
let MF = 'all';
async function vMedia() {
  await loadMedia();
  const list = Object.values(M).filter(r => MF === 'all' || r.kind === MF);
  main(`<h2>المكتبة</h2><div class="card"><div class="row"><input type="file" id="mu" multiple accept="image/*,audio/*,application/pdf" style="flex:1"><label style="margin:0"><input type="checkbox" id="mp"> ملف خاص</label><button class="btn" onclick="mediaUp()">رفع</button></div>
  <p class="mut">الصور والصوت وملفات PDF حتى 20 ميغابايت. الملف الخاص لا يُفتح إلا بحساب مفعّل.</p>
  <div class="row" style="margin:8px 0">${[['all', 'الكل'], ['image', 'صور'], ['audio', 'صوتيات'], ['pdf', 'PDF']].map(f => `<button class="tab ${MF === f[0] ? 'on' : ''}" onclick="MF='${f[0]}';vMedia()">${f[1]}</button>`).join('')}</div>
  <div class="lib">${list.map(r => `<div class="m">${thumb(r)}<div>${e(r.name)}</div><div class="mut">${r.bucket === 'media-private' ? 'خاص' : 'عام'} · ${Math.round((r.size_bytes || 0) / 1024)} ك.ب</div>
   ${r.kind === 'audio' ? `<audio controls preload="none" src="${e(murl(r))}" style="width:100%"></audio>` : `<a href="${e(murl(r))}" target="_blank" rel="noopener">فتح</a>`}
   <div><button class="btn d s" onclick="delMedia('${r.id}')">حذف</button></div></div>`).join('') || '<p class="mut">لا توجد ملفات.</p>'}</div></div>`);
}
async function mediaUp() {
  const fs = [...$('#mu').files]; if (!fs.length) return toast('اختاري ملفاً أولاً', 1);
  const priv = $('#mp').checked; let n = 0;
  for (const f of fs) { try { await upl(f, priv); n++; } catch (x) { fail(x); } }
  if (n) toast('تم رفع ' + n + ' ملف'); vMedia();
}
async function delMedia(id) {
  const r = M[id]; if (!r || !ok('حذف الملف نهائياً؟ سيختفي من أي قصة أو نشاط يستخدمه.')) return;
  const a = await sb.storage.from(r.bucket).remove([r.path]); if (a.error) return fail(a.error);
  const b = await sb.from('media').delete().eq('id', id); if (b.error) return fail(b.error);
  toast('تم الحذف'); vMedia();
}

/* ---------- subscribers ---------- */
const d10 = v => v ? new Date(v).toISOString().slice(0, 10) : '';
function subState(s) {
  if (!s.ever_active) return '<span class="tag">غير مفعّلة بعد</span>';
  const live = s.status === 'active' && (!s.current_period_end || new Date(s.current_period_end) > new Date());
  return live ? '<span class="tag p">فعّالة' + (s.current_period_end ? ' حتى <bdi>' + d10(s.current_period_end) + '</bdi>' : '') + '</span>' : '<span class="tag" style="background:#fbe3c8">منتهية: قراءة فقط</span>';
}
async function vSubs() {
  const { data, error } = await sb.from('subscribers').select('*').order('started_at', { ascending: false });
  if (error) return fail(error);
  main(`<h2>المشتركات</h2><div class="card"><p class="mut" style="margin-top:0">عند انتهاء الاشتراك تتحول الأم إلى وضع القراءة فقط: ترى كل ما فتحته سابقاً، ولا تلعب ولا تحفظ تقدماً جديداً ولا ترى الحزم الجديدة. لا يُحذف شيء من تقدمها. عند التجديد يعود كل شيء تلقائياً.</p>
  <div class="tw"><table><tr><th>الجوال</th><th>الحالة الآن</th><th>الاشتراك</th><th>بداية الاشتراك</th><th>نهاية الفترة</th><th></th></tr>
  ${(data || []).map(s => `<tr><td dir="ltr">${e(s.email || s.phone || '—')}</td><td>${subState(s)}</td>
  <td><select id="s_${s.user_id}"><option value="active" ${s.status === 'active' ? 'selected' : ''}>فعّال</option><option value="inactive" ${s.status === 'inactive' ? 'selected' : ''}>غير فعّال</option><option value="expired" ${s.status === 'expired' ? 'selected' : ''}>منتهي</option></select></td>
  <td><input type="date" id="a_${s.user_id}" value="${d10(s.started_at)}" data-o="${d10(s.started_at)}"></td><td><input type="date" id="b_${s.user_id}" value="${d10(s.current_period_end)}" data-o="${d10(s.current_period_end)}"></td>
  <td style="white-space:nowrap"><button class="btn s" onclick="renewSub('${s.user_id}')">تفعيل / تجديد 30 يوماً</button> <button class="btn g s" onclick="saveSub('${s.user_id}')">حفظ التعديل</button></td></tr>`).join('')}</table></div>
  ${(data || []).length ? '' : '<p class="mut">لا توجد مشتركات بعد. تظهر الأم هنا بعد أول تسجيل دخول.</p>'}
  <p class="mut">الأم الجديدة تظهر "غير مفعّلة" حتى تضغطي "تفعيل / تجديد". التجديد بعد انقطاع يكمل عدّاد الأشهر من حيث توقف.</p></div>`);
}
async function renewSub(id) {
  const { data: s, error } = await sb.from('subscribers').select('*').eq('user_id', id).single();
  if (error) return fail(error);
  const now = Date.now(), cur = s.current_period_end ? new Date(s.current_period_end).getTime() : 0;
  const base = s.status === 'active' && cur > now ? cur : now;
  const r = await sb.from('subscribers').update({ status: 'active', current_period_end: new Date(base + 30 * 864e5).toISOString() }).eq('user_id', id);
  r.error ? fail(r.error) : (toast('تم التفعيل / التجديد 30 يوماً'), vSubs());
}
async function saveSub(id) {
  const el = k => $('#' + k + '_' + id), v = k => el(k).value, ch = k => v(k) !== el(k).dataset.o;
  const row = { status: v('s') };
  if (ch('a') && v('a')) row.started_at = new Date(v('a')).toISOString();      // untouched dates are not re-sent
  if (ch('b')) row.current_period_end = v('b') ? new Date(v('b')).toISOString() : null;
  else if (row.status === 'active' && !v('b')) row.current_period_end = new Date(Date.now() + 30 * 864e5).toISOString();
  const { error } = await sb.from('subscribers').update(row).eq('user_id', id);
  error ? fail(error) : (toast('تم الحفظ'), vSubs());
}
boot();
</script>
</body>
</html>
