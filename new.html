<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#bfe4f3"><title>جزيرة الأصدقاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root{--sky1:#bfe4f3;--sky2:#eaf7f0;--sea:#8dd0dd;--sand:#f6e7c6;--grass:#a9d78d;--grass2:#8fc873;--ink:#46352c;--ink2:#7c6a5e;--cream:#fffaf0;--coral:#f59b8b;--sun:#f7c75a;--lilac:#c9b8ee;--mint:#9fddc5;--blue:#86b9ea;--pink:#f8b6c6;--shadow:0 6px 0 rgba(90,70,50,.12),0 14px 28px rgba(90,70,50,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);color:var(--ink);font-family:'Baloo Bhaijaan 2','Cairo','Geeza Pro','Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.sky{position:fixed;inset:0;background:linear-gradient(#bfe4f3 0%,#dff2f1 46%,#f6efd6 100%);z-index:-2}
.cloud{position:fixed;z-index:-1;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:14px 34px;background:var(--sun);box-shadow:0 6px 0 #d9a93a,0 12px 20px rgba(120,90,30,.18);font-size:22px;font-weight:700;transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a93a}
.btn.round{width:78px;height:78px;padding:0}
.bk{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:20;width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.bk:active{transform:scale(.92)}
.card{background:var(--cream);border-radius:34px;box-shadow:var(--shadow);padding:22px}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.pg{min-height:100%;padding:max(18px,env(safe-area-inset-top)) 18px 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.hd2{display:flex;align-items:center;gap:12px;margin:4px 0 12px;min-height:62px}
.ttl{font-size:clamp(26px,4.4vw,38px);font-weight:800}
.stars{display:inline-flex;gap:4px;align-items:center}
.me{position:fixed;left:8px;bottom:6px;z-index:15;pointer-events:auto}
.owlh{position:fixed;right:6px;bottom:6px;z-index:15}
.tile2{border-radius:30px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 12px;min-width:150px;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.tile2:active{transform:scale(.93)}
.pulse{animation:pls 1.8s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pop-in{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.wob{animation:wob .45s}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-3deg)}50%{transform:translateX(9px) rotate(3deg)}80%{transform:translateX(-5px)}}
.fx{position:fixed;pointer-events:none;z-index:60}
#wipe{position:fixed;inset:0;z-index:80;pointer-events:none}
#wipe i{position:absolute;border-radius:50%;background:#fffdf5;will-change:transform}
.spk{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center}
.spk:active{transform:scale(.92)}
/* map */
.map{position:relative;width:min(100%,1000px);margin:0 auto;aspect-ratio:1000/1180;max-height:100vh}
.map>svg.bgm{position:absolute;inset:0;width:100%;height:100%}
.lm{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:22%;min-width:104px;z-index:3}
.lm .ico{width:100%;aspect-ratio:1;transition:transform .16s cubic-bezier(.3,1.6,.5,1);animation:lmb 4s var(--d) ease-in-out infinite}
.lm:active .ico{transform:scale(.9)}
.lm .lab{background:#fff;border-radius:999px;padding:2px 16px 0;font-weight:800;font-size:clamp(15px,2.5vw,22px);box-shadow:0 4px 0 rgba(90,70,50,.12);margin-top:-6px;white-space:nowrap}
@keyframes lmb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.avm{position:absolute;z-index:5;transform:translate(-50%,-92%);transition:left .85s cubic-bezier(.45,.1,.4,1),top .85s cubic-bezier(.45,.1,.4,1);width:15%}
.avm .an{width:100%!important}
.avm[data-dir=l] .an-svg{transform:scaleX(-1)}
.npc{position:absolute;z-index:4;transform:translate(-50%,-90%)}
.npc .an{width:100%!important}
</style></head><body><div id="app"></div><div id="wipe"></div>

<script>/* ===== Island friends: four hand-built animals with one shared skeleton ===== */
(function(){
const PAL={
 bunny:{b:'#f7e6df',bl:'#ffdfe6',a:'#f7a6bb',c:'#c8b6ee',d:'#e9d7d0'},
 bear:{b:'#c98e61',bl:'#f0d09f',a:'#a56d46',c:'#8db8e8',d:'#b07a52'},
 owl:{b:'#d9a872',bl:'#f7e5c2',a:'#c08d58',c:'#c3b1ee',d:'#c59563'},
 ele:{b:'#a9c1d9',bl:'#d4e1ed',a:'#f4b5c2',c:'#ffffff',d:'#94adc8'}
};
const eye=(x,y,r,big)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.18}" fill="#3a2a24"/><circle cx="${x+r*.38}" cy="${y-r*.45}" r="${r*.42}" fill="#fff"/><circle cx="${x-r*.35}" cy="${y+r*.5}" r="${r*.2}" fill="#fff" opacity=".7"/>`;
function ears(k,p){
 if(k==='bunny')return `<g class="ear l"><ellipse cx="72" cy="30" rx="17" ry="46" fill="${p.b}" transform="rotate(-9 72 30)"/><ellipse cx="72" cy="34" rx="8" ry="32" fill="${p.a}" opacity=".7" transform="rotate(-9 72 34)"/></g><g class="ear r"><ellipse cx="128" cy="30" rx="17" ry="46" fill="${p.b}" transform="rotate(9 128 30)"/><ellipse cx="128" cy="34" rx="8" ry="32" fill="${p.a}" opacity=".7" transform="rotate(9 128 34)"/></g>`;
 if(k==='bear')return `<g class="ear l"><circle cx="62" cy="52" r="18" fill="${p.b}"/><circle cx="62" cy="53" r="9" fill="${p.bl}"/></g><g class="ear r"><circle cx="138" cy="52" r="18" fill="${p.b}"/><circle cx="138" cy="53" r="9" fill="${p.bl}"/></g>`;
 if(k==='owl')return `<g class="ear l"><path d="M56 62L52 28L84 48Z" fill="${p.a}"/></g><g class="ear r"><path d="M144 62L148 28L116 48Z" fill="${p.a}"/></g>`;
 return `<g class="ear l"><circle cx="48" cy="98" r="33" fill="${p.b}"/><circle cx="52" cy="100" r="22" fill="${p.a}" opacity=".75"/></g><g class="ear r"><circle cx="152" cy="98" r="33" fill="${p.b}"/><circle cx="148" cy="100" r="22" fill="${p.a}" opacity=".75"/></g>`;
}
function face(k,p){
 let f='';
 if(k==='owl'){
  f+=`<ellipse cx="100" cy="94" rx="40" ry="36" fill="${p.bl}"/>`;
  f+=`<circle cx="80" cy="90" r="19" fill="#fff"/><circle cx="120" cy="90" r="19" fill="#fff"/><g class="eyes"><circle cx="82" cy="91" r="10" fill="#3a2a24"/><circle cx="86" cy="87" r="4" fill="#fff"/><circle cx="118" cy="91" r="10" fill="#3a2a24"/><circle cx="122" cy="87" r="4" fill="#fff"/></g>`;
  f+=`<g fill="none" stroke="#b9823f" stroke-width="3.5"><circle cx="80" cy="90" r="22"/><circle cx="120" cy="90" r="22"/><path d="M102 90h-4"/></g>`;
  f+=`<path d="M92 108L100 122L108 108Z" fill="#f2a64f"/>`;
  f+=`<ellipse cx="64" cy="108" rx="9" ry="6" fill="#f4a3a3" opacity=".6"/><ellipse cx="136" cy="108" rx="9" ry="6" fill="#f4a3a3" opacity=".6"/>`;
  f+=`<g class="m-open"><ellipse cx="100" cy="124" rx="6" ry="5" fill="#8a3b3b"/></g>`;
  return f;
 }
 f+=`<g class="eyes">${eye(78,90,7.5)}${eye(122,90,7.5)}</g>`;
 f+=`<ellipse cx="62" cy="108" rx="10" ry="7" fill="#f89aa6" opacity=".55"/><ellipse cx="138" cy="108" rx="10" ry="7" fill="#f89aa6" opacity=".55"/>`;
 if(k==='bunny')f+=`<path d="M94 104q6 6 12 0q-6 -7 -12 0z" fill="#f08fa6"/><path d="M100 108v6M100 114q-8 8 -14 3M100 114q8 8 14 3" stroke="#d9748d" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60 100l-18-4M60 108l-18 3M140 100l18-4M140 108l18 3" stroke="#e5cfc9" stroke-width="2.2" stroke-linecap="round"/>`;
 if(k==='bear')f+=`<ellipse cx="100" cy="112" rx="24" ry="18" fill="${p.bl}"/><ellipse cx="100" cy="104" rx="8" ry="6" fill="#4a3228"/><path d="M100 110v6M100 116q-8 7 -15 2M100 116q8 7 15 2" stroke="#4a3228" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 if(k==='ele')f+=`<g class="trunk"><path d="M88 108Q88 150 104 158Q116 162 116 148" fill="none" stroke="${p.b}" stroke-width="26" stroke-linecap="round"/><path d="M88 112Q88 148 103 156" fill="none" stroke="${p.a}" stroke-width="3" stroke-linecap="round" opacity=".55"/></g>`;
 f+=`<g class="m-open"><ellipse cx="100" cy="${k==='ele'?128:122}" rx="9" ry="7.5" fill="#8a3b3b"/></g>`;
 return f;
}
function head(k,p){
 let h='';
 if(k!=='ele')h+=ears(k,p);
 else h+=ears(k,p);
 h+=`<circle cx="100" cy="92" r="52" fill="${p.b}"/>`;
 if(k==='owl')h+=`<path d="M70 52q30 18 60 0" stroke="${p.a}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>`;
 if(k==='bunny')h+=`<path d="M122 52q14-12 28-4q-4 14-18 14z" fill="#f6a0b6"/><path d="M122 52q-12-10-26-3q3 13 17 14z" fill="#f6a0b6"/><circle cx="123" cy="54" r="6" fill="#e88aa3"/>`;
 if(k==='bear')h+=`<path d="M84 46q16-8 32 0" stroke="${p.a}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>`;
 if(k==='ele'){
  h+=`<path d="M68 54Q100 34 132 54" stroke="#fff" stroke-width="3" fill="none" opacity=".35"/>`;
  /* chef hat */
  h+=`<g class="hat"><rect x="72" y="36" width="56" height="18" rx="6" fill="#fff"/><circle cx="78" cy="30" r="16" fill="#fff"/><circle cx="100" cy="22" r="19" fill="#fff"/><circle cx="122" cy="30" r="16" fill="#fff"/><path d="M76 48h48" stroke="#e8e2d8" stroke-width="3"/></g>`;
 }
 h+=face(k,p);
 return h;
}
function body(k,p){
 let b='';
 if(k==='bunny')b+=`<circle cx="52" cy="196" r="14" fill="#fff"/>`; /* tail */
 b+=`<g class="leg l"><rect x="74" y="196" width="24" height="34" rx="12" fill="${p.b}"/><ellipse cx="84" cy="232" rx="17" ry="9.5" fill="${k==='owl'?'#f2a64f':p.b}"/></g><g class="leg r"><rect x="102" y="196" width="24" height="34" rx="12" fill="${p.b}"/><ellipse cx="116" cy="232" rx="17" ry="9.5" fill="${k==='owl'?'#f2a64f':p.b}"/></g>`;
 b+=`<ellipse cx="100" cy="172" rx="48" ry="52" fill="${p.b}"/><ellipse cx="100" cy="180" rx="31" ry="35" fill="${p.bl}"/>`;
 if(k==='bunny')b+=`<path d="M56 158Q100 140 144 158L152 214Q100 232 48 214Z" fill="${p.c}"/><path d="M62 164Q100 150 138 164" stroke="#fff" stroke-width="3.5" fill="none" opacity=".6"/><g fill="#fff" opacity=".85"><circle cx="76" cy="190" r="4"/><circle cx="104" cy="200" r="4"/><circle cx="126" cy="184" r="4"/></g>`;
 if(k==='bear')b+=`<path d="M60 176h80v38q0 14-14 14H74q-14 0-14-14z" fill="${p.c}"/><path d="M72 176v-26M128 176v-26" stroke="${p.c}" stroke-width="9" stroke-linecap="round"/><circle cx="72" cy="170" r="5" fill="#f7c75a"/><circle cx="128" cy="170" r="5" fill="#f7c75a"/><rect x="86" y="190" width="28" height="20" rx="6" fill="#7aa5d6"/>`;
 if(k==='owl')b+=`<g fill="${p.d}" opacity=".7"><path d="M80 170q6 6 12 0q-6 -6 -12 0M102 170q6 6 12 0q-6 -6 -12 0M91 186q6 6 12 0q-6 -6 -12 0M70 190q6 6 12 0q-6 -6 -12 0M112 190q6 6 12 0q-6 -6 -12 0"/></g><path d="M66 150Q100 170 134 150L130 166Q100 184 70 166Z" fill="${p.c}"/><path d="M118 168L128 196L114 186Z" fill="${p.c}"/>`;
 if(k==='ele')b+=`<path d="M60 176h80v36q0 16-16 16H76q-16 0-16-16z" fill="#fff"/><path d="M60 176h80M60 188h80" stroke="#e6edf4" stroke-width="3"/><g fill="#f4b5c2"><circle cx="100" cy="200" r="5"/></g><path d="M86 160l14 12l14-12" fill="#f4b5c2"/>`;
 return b;
}
function arms(k,p){
 if(k==='owl')return `<g class="arm l"><path d="M60 150Q36 170 48 204Q62 196 64 160Z" fill="${p.a}"/><path d="M54 190q4-8 8-4M50 180q4-8 9-4" stroke="${p.d}" stroke-width="3" fill="none" stroke-linecap="round"/></g><g class="arm r"><path d="M140 150Q164 170 152 204Q138 196 136 160Z" fill="${p.a}"/><path d="M146 190q-4-8 -8-4M150 180q-4-8 -9-4" stroke="${p.d}" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
 const sleeve=k==='bear'?p.c:'';
 return `<g class="arm l"><rect x="46" y="146" width="22" height="46" rx="11" fill="${p.b}"/><circle cx="57" cy="192" r="11.5" fill="${p.b}"/></g><g class="arm r"><rect x="132" y="146" width="22" height="46" rx="11" fill="${p.b}"/><circle cx="143" cy="192" r="11.5" fill="${p.b}"/></g>`;
}
window.ANIMAL=function(k){const p=PAL[k];
 return `<svg class="an-svg" viewBox="0 -20 200 270" aria-hidden="true"><ellipse class="shd" cx="100" cy="242" rx="58" ry="8" fill="#4a3b6a" opacity=".13"/><g class="lean"><g class="jumper"><g class="bob">${body(k,p)}${arms(k,p)}<g class="head">${head(k,p)}</g></g></g></g></svg>`};
window.AN=(k,h,extra)=>`<div class="an" data-k="${k}" data-s="idle" data-talk="0" style="width:${Math.round(h*.8)}px;--d:${(Math.random()*3).toFixed(2)}s;${extra||''}">${ANIMAL(k)}</div>`;
window.anSet=(e,s,ms)=>{if(!e)return;e.dataset.s=s;clearTimeout(e._t);if(ms)e._t=setTimeout(()=>{e.dataset.s='idle'},ms)};
const css=`
.an{display:inline-block;line-height:0;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.an-svg{width:100%;height:auto;display:block;overflow:visible}
.an *{transform-box:view-box}
.an .lean,.an .jumper,.an .bob{transform-origin:100px 238px}.an .shd{transform-origin:100px 242px}
.an .leg.l{transform-origin:86px 200px}.an .leg.r{transform-origin:114px 200px}
.an .arm.l{transform-origin:58px 150px}.an .arm.r{transform-origin:142px 150px}
.an .head{transform-origin:100px 140px}
.an .ear.l{transform-origin:74px 60px}.an .ear.r{transform-origin:126px 60px}
.an[data-k=bear] .ear.l{transform-origin:62px 54px}.an[data-k=bear] .ear.r{transform-origin:138px 54px}
.an[data-k=ele] .ear.l{transform-origin:70px 90px}.an[data-k=ele] .ear.r{transform-origin:130px 90px}
.an[data-k=owl] .ear.l{transform-origin:70px 60px}.an[data-k=owl] .ear.r{transform-origin:130px 60px}
.an .trunk{transform-origin:100px 108px}
.an .eyes{transform-origin:100px 92px;animation:an_bl 4.6s var(--d) infinite}
.an .m-open{opacity:0;transform-origin:100px 122px}
.an[data-k=owl] .m-open{transform-origin:100px 124px}
.an[data-s=idle] .bob{animation:an_br 3.2s var(--d) ease-in-out infinite}
.an[data-s=idle] .head{animation:an_ht 4.6s var(--d) ease-in-out infinite}
.an[data-s=idle] .arm.l{animation:an_sl 3.2s var(--d) ease-in-out infinite}
.an[data-s=idle] .arm.r{animation:an_sr 3.2s var(--d) ease-in-out infinite}
.an[data-s=idle] .ear.l{animation:an_el 5s var(--d) ease-in-out infinite}
.an[data-s=idle] .ear.r{animation:an_er 5s calc(var(--d) + .6s) ease-in-out infinite}
.an[data-k=ele][data-s=idle] .trunk{animation:an_tr 3.6s var(--d) ease-in-out infinite}
.an[data-s=hop] .jumper{animation:an_hop .85s cubic-bezier(.3,.7,.4,1)}
.an[data-s=hop] .arm.l{animation:an_aupl .85s ease-in-out}.an[data-s=hop] .arm.r{animation:an_aupr .85s ease-in-out}
.an[data-s=hop] .shd{animation:an_shj .85s}
.an[data-s=wave] .bob{animation:an_br 3.2s ease-in-out infinite}
.an[data-s=wave] .arm.r{animation:an_wave .42s ease-in-out infinite alternate}
.an[data-s=wave] .head{animation:an_ht 1.6s ease-in-out infinite}
.an[data-s=dance] .bob{animation:an_db .6s ease-in-out infinite alternate}
.an[data-s=dance] .arm.l{animation:an_dal .6s ease-in-out infinite alternate}.an[data-s=dance] .arm.r{animation:an_dar .6s ease-in-out infinite alternate}
.an[data-s=dance] .leg.l{animation:an_dll .3s ease-in-out infinite alternate}.an[data-s=dance] .leg.r{animation:an_dlr .3s ease-in-out infinite alternate}
.an[data-s=dance] .head{animation:an_dh .6s ease-in-out infinite alternate}
.an[data-s=run] .bob{animation:an_rb .32s ease-in-out infinite}
.an[data-s=run] .leg.l{animation:an_rl .64s ease-in-out infinite}.an[data-s=run] .leg.r{animation:an_rl .64s ease-in-out -.32s infinite}
.an[data-s=run] .arm.l{animation:an_ral .64s ease-in-out infinite}.an[data-s=run] .arm.r{animation:an_rar .64s ease-in-out -.32s infinite}
.an[data-s=run] .ear.l,.an[data-s=run] .ear.r{animation:an_er .32s ease-in-out infinite}
.an[data-s=cheer] .jumper{animation:an_ch .5s ease-in-out infinite}
.an[data-s=cheer] .arm.l{animation:an_cal .25s ease-in-out infinite alternate}.an[data-s=cheer] .arm.r{animation:an_car .25s ease-in-out infinite alternate}
.an[data-s=spin] .jumper{transform-origin:100px 150px;animation:an_sp .95s cubic-bezier(.4,.1,.3,1)}
.an[data-s=spin] .arm.l{transform:rotate(110deg)}.an[data-s=spin] .arm.r{transform:rotate(-110deg)}
.an[data-s=pop] .jumper{animation:an_pop .6s cubic-bezier(.3,1.5,.5,1)}
.an[data-s=pop] .eyes{animation:none;transform:scale(1.2)}
.an[data-s=pop] .arm.l{transform:rotate(50deg)}.an[data-s=pop] .arm.r{transform:rotate(-50deg)}
.an[data-s=listen] .head{animation:an_li 2.4s ease-in-out infinite}
.an[data-s=listen] .ear.l{animation:an_el 1.2s ease-in-out infinite}.an[data-s=listen] .ear.r{animation:an_er 1.2s ease-in-out infinite}
.an[data-s=eat] .head{animation:an_ea .32s ease-in-out infinite alternate}
.an[data-s=eat] .eyes{animation:none;transform:scaleY(.4)}
.an[data-s=eat] .m-open{opacity:1;animation:an_em .32s ease-in-out infinite alternate}
.an[data-k=ele][data-s=eat] .trunk{animation:an_te .32s ease-in-out infinite alternate}
.an[data-s=run] .m-open,.an[data-s=hop] .m-open,.an[data-s=dance] .m-open,.an[data-s=cheer] .m-open,.an[data-s=wave] .m-open{opacity:1;transform:scale(.9)}
.an[data-s=pop] .m-open{opacity:1;transform:scale(.7,1.1)}
.an[data-talk="1"] .m-open{opacity:1;animation:an_tk .26s ease-in-out infinite alternate}
@keyframes an_bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes an_br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes an_ht{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes an_sl{0%,100%{transform:rotate(3deg)}50%{transform:rotate(9deg)}}
@keyframes an_sr{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-9deg)}}
@keyframes an_el{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}96%{transform:rotate(4deg)}}
@keyframes an_er{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(9deg)}96%{transform:rotate(-4deg)}}

  <div class="card"><h3>القرآن</h3>${SUR.map((s,i)=>{const total=ayOrder(s.n).length,d=P.quran[s.n]||0;return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${i?'سورة العصر':'سورة الفاتحة'}</span><span>${d} / ${total}</span></div><div style="height:16px;border-radius:99px;background:#eee4d2;overflow:hidden"><div style="height:100%;width:${d/total*100}%;background:linear-gradient(90deg,#9fddc5,#8fc873)"></div></div></div>`}).join('')}</div>
  <div class="card"><h3>هذا الأسبوع</h3><div style="display:flex;gap:10px;align-items:flex-end;height:110px">${days.map(v=>`<div style="flex:1;text-align:center"><div style="height:${v/mx*80}px;min-height:6px;background:#86b9ea;border-radius:8px"></div><div style="font-size:13px;color:var(--ink2)">${v}</div></div>`).join('')}</div><div class="row" style="margin-top:14px;justify-content:flex-start;gap:24px"><span><b style="font-size:30px">${P.games}</b> لعبة</span><span><b style="font-size:30px">${P.stars}</b> نجمة</span><span><b style="font-size:30px">${P.meals||0}</b> وجبة في المطبخ</span></div></div>`}
 if(tab==='act'){
  body=`<div class="card"><h3>أوراق الشهر</h3><div class="row" style="justify-content:flex-start;gap:12px">${LET.map((l,i)=>`<button class="tile2" style="min-width:0;width:150px" onclick="prn('t',${i})"><div style="font-size:64px;font-weight:800;color:${l.col};line-height:1.1">${l.c}</div><span style="font-weight:700">تتبّع الحرف</span>${ic('print',24)}</button>`).join('')}<button class="tile2" style="min-width:0;width:150px" onclick="prn('f')">${pic('apple',60)}<span style="font-weight:700">لوّن الفواكه</span>${ic('print',24)}</button><button class="tile2" style="min-width:0;width:150px" onclick="prn('s')"><svg viewBox="0 0 100 100" width="60" height="60"><circle cx="34" cy="38" r="22" fill="none" stroke="#46352c" stroke-width="4"/><rect x="48" y="44" width="40" height="40" rx="10" fill="none" stroke="#46352c" stroke-width="4"/></svg><span style="font-weight:700">أشكال</span>${ic('print',24)}</button></div></div>`}
 if(tab==='sch'){
  const D=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'],S=['صباحًا','عصرًا','مساءً'],A=['—','الحروف','القرآن','الرسم','قصتي','الفواكه','المطبخ','لعب حر'],sc=LS.get('sched',{});
  body=`<div class="card" style="overflow:auto"><table style="width:100%;border-collapse:separate;border-spacing:8px"><tr><th></th>${S.map(s=>`<th>${s}</th>`).join('')}</tr>${D.map((d,i)=>`<tr><th style="text-align:right">${d}</th>${S.map((s,j)=>{const k=i+'_'+j,v=sc[k]||0;return `<td><button class="tile2" style="min-width:0;width:100%;padding:12px 4px;font-weight:700;background:${v?'#e2f5ec':'#fff'}" onclick="sch('${k}')">${A[v]}</button></td>`}).join('')}</tr>`).join('')}</table></div>`;window.sch=k=>{const s=LS.get('sched',{});s[k]=((s[k]||0)+1)%A.length;LS.set('sched',s);go('mom','sch',null,1)}}
 if(tab==='book'){
  const d=LS.get('draws',[]),sv=LS.get('stories',[]);
  body=`<div class="card"><h3>لوحات الشهر</h3><div class="row" style="gap:18px">${d.length?d.map((x,i)=>`<div style="background:#fff;padding:10px 10px 28px;box-shadow:var(--shadow);border-radius:6px;transform:rotate(${[-3,2,-1][i%3]}deg);width:min(28vw,200px)"><img src="${x.img}" style="width:100%;display:block"></div>`).join(''):'<span style="color:var(--ink2)">لا توجد لوحات بعد</span>'}</div></div>
  <div class="card"><h3>قصصي</h3><div class="row" style="justify-content:flex-start;gap:12px">${sv.length?sv.map((s,i)=>`<button class="tile2" style="min-width:0;width:130px;padding:8px" onclick="go('st_read',${i})"><svg viewBox="0 0 400 300" width="110" height="82" style="border-radius:12px">${SCN[s.pages[0].scene]}</svg>${ic('play',24)}</button>`).join(''):'<span style="color:var(--ink2)">لا توجد قصص بعد</span>'}</div></div>`}
 if(tab==='set'){
  body=`<div class="card"><h3>الإعدادات</h3><div class="row" style="justify-content:flex-start;gap:12px"><button class="btn" style="background:#f8c9d4;box-shadow:0 6px 0 #dca2b2;font-size:18px" id="rs">مسح تقدّم الطفل</button><button class="btn" style="background:#cfe8b8;box-shadow:0 6px 0 #a9c98f;font-size:18px" onclick="LS.set('me',null);go('gate')">تغيير الشخصية</button></div></div>`;
  setTimeout(()=>{const r=$('#rs');if(r)r.onclick=()=>{if(r.dataset.c){LS.set('prog',{letters:{},quran:{},games:0,stars:0,meals:0,days:{}});go('mom','set',null,1)}else{r.dataset.c=1;r.textContent='اضغطي مرة أخرى للتأكيد'}}},0)}
 $('#app').innerHTML=`<div class="pg" style="justify-content:flex-start;align-items:stretch;max-width:100%;margin:0 auto;gap:12px;background:#f3eadb"><div style="width:min(100%,760px);display:flex;flex-direction:column;gap:12px;align-self:center"><style>.pg h3{margin:0 0 10px;font-size:22px}.tabs button{padding:8px 18px;border-radius:999px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(90,70,50,.1)}.tabs button.on{background:var(--sun)}@media print{body>*:not(#print){display:none!important}#print{display:block!important}}</style>${back('home').replace("go('home')","MOM=false;go('gate')")}<div class="hd2" style="margin-right:70px"><div class="ttl">ركن الأم</div></div><div class="tabs row" style="justify-content:flex-start;gap:8px">${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('mom','${t[0]}',null,1)">${t[1]}</button>`).join('')}</div>${body}</div></div>`};
/* printable sheets */
window.prn=(k,i)=>{let h='';if(k==='t'){const l=LET[i];h=`<h2 style="text-align:center">تتبّع حرف ${l.n}</h2>`+[...Array(5)].map(()=>`<div style="display:flex;justify-content:space-around;font-size:96px;font-weight:800;color:#ddd;border-bottom:2px dashed #ccc;line-height:1.3">${[...Array(5)].map(()=>l.c).join('<span></span>')}</div>`).join('')}
 if(k==='f')h='<h2 style="text-align:center">لوّن الفواكه</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'+FR.map(f=>`<svg viewBox="0 0 100 100" style="width:100%;filter:grayscale(1) contrast(0) brightness(1.6) drop-shadow(0 0 0 #000)"><g style="filter:none">${PIC[f[1]]}</g></svg>`).join('')+'</div>';
 if(k==='s')h='<h2 style="text-align:center">أشكال</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px">'+Object.keys(SHP).map(s=>`<svg viewBox="0 0 100 100" style="width:100%">${SHP[s]('#fff').replace(/fill="#fff"/g,'fill="none" stroke="#333" stroke-width="3"')}</svg>`).join('')+'</div>';
 let p=$('#print');if(!p){p=document.createElement('div');p.id='print';p.style.display='none';document.body.appendChild(p)}p.innerHTML=h;setTimeout(()=>window.print(),100)};

sky();go('gate',null,null,true);
</script></body></html>
