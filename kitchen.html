<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مطبخ طلال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one-screen kitchen. Talal (hungry, always moving) on the wall side, the cooking counter below or beside him. Fully silent: everything he says is written in his speech bubble. */
  --ink:#3b2f63; --wall:#c4f0df; --wall2:#d6f6ea; --counter:#ebe3ff; --counter2:#d3c6ff;
  --tomato:#ff6b57; --butter:#ffd86b; --pink:#ff8fb1; --mint:#3fc79a; --blue:#4aa8ff;
  --font:'Baloo Bhaijaan 2','Cairo','Tajawal',system-ui,sans-serif;
  --tw:clamp(96px,16vh,200px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background-color:var(--wall);background-image:linear-gradient(rgba(255,255,255,.5) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.5) 2px,transparent 2px);background-size:56px 56px;color:var(--ink);font-family:var(--font);font-weight:700;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:4px dashed #7a63e8;outline-offset:3px}
#app{position:relative;height:100%;display:flex;flex-direction:column;isolation:isolate}

.top{flex:none;height:56px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand,.pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;box-shadow:0 4px 0 rgba(59,47,99,.12)}
.brand{padding:3px 14px 3px 5px}
.brand-badge{width:34px;height:34px;border-radius:50%;background:var(--tomato);display:grid;place-items:center}
.brand-badge svg{width:22px;height:22px}
.brand-name{font-size:22px;font-weight:800;line-height:1;padding-top:3px}
.pill{height:40px;padding:2px 14px 0 12px;font-size:20px;font-weight:800}
.pill svg{width:24px;height:24px;margin-top:-2px}
.pill.pulse{animation:pulse .6s}

#kitchen{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,38%) minmax(0,1fr)}
.tzone{position:relative;display:flex;flex-direction:column;min-height:0;z-index:2}
.garland{position:absolute;left:0;right:0;top:0;width:100%;height:44px;pointer-events:none}
.tz-strip{position:relative;z-index:2;flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 0}
.meter,.wish{display:flex;align-items:center;gap:6px;height:34px;padding:3px 12px 0;background:#fff;border-radius:999px;box-shadow:0 4px 0 rgba(59,47,99,.12);font-size:clamp(14px,3.6vw,18px);line-height:1}
.meter .seg{width:16px;height:16px;border-radius:50%;background:#e8e1ff;margin-top:-3px;transition:background .3s,transform .3s}
.meter .seg.on{background:var(--tomato);transform:scale(1.12)}
.wish .em{font-size:1.5em;margin-top:-4px;animation:wiggle 1.6s ease-in-out infinite}
.bwrap{position:relative;z-index:4;flex:none;min-height:54px;display:flex;justify-content:center;align-items:flex-end;padding:0 12px;margin-bottom:-14px;pointer-events:none}
#bubble{position:relative;width:max-content;max-width:min(94%,400px);background:#fff;border-radius:22px;padding:6px 16px 2px;font-size:clamp(17px,4.4vw,24px);font-weight:800;line-height:1.35;text-align:center;box-shadow:0 5px 0 rgba(59,47,99,.14),0 8px 20px rgba(59,47,99,.12);opacity:0;transform:scale(.7);transform-origin:50% 100%;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
#bubble.show{opacity:1;transform:none}
#bubble::after{content:"";position:absolute;bottom:-8px;left:50%;width:18px;height:18px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:0 0 6px 0}
.tal-area{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-end;padding-bottom:16px}
#talal{position:relative;flex:none;width:var(--tw);cursor:pointer}
#talal.enter{animation:rise .9s cubic-bezier(.3,1.5,.5,1) both}
#talal:focus-visible{border-radius:26px}
.burst{position:absolute;z-index:5;font-size:clamp(24px,6.5vw,34px);font-weight:800;color:var(--tomato);-webkit-text-stroke:6px #fff;paint-order:stroke fill;pointer-events:none;white-space:nowrap;animation:burst 1.3s ease-out forwards}

/* ---------- Talal (copied rig) ---------- */
.t-svg{width:100%;height:auto;display:block;overflow:visible}
.lean,.jumper,.bob,.t-shadow{transform-origin:100px 270px}
.t-shadow{transform-origin:100px 277px}
.lean{transition:transform .25s}
.leg.l{transform-origin:84px 214px}.leg.r{transform-origin:116px 214px}
.arm.l{transform-origin:69px 164px}.arm.r{transform-origin:131px 164px}
.head{transform-origin:100px 150px}
.eyes{transform-origin:100px 103px;animation:blink 4.2s infinite}
.brows{transform-origin:100px 85px}
.m-open{opacity:0;transform-origin:100px 127px}
.m-smile{transition:opacity .1s}
.arm.l{transform:rotate(5deg)}.arm.r{transform:rotate(-5deg)}

[data-dir="r"] .lean{transform:rotate(7deg)}
[data-dir="l"] .lean{transform:rotate(-7deg)}

[data-state="idle"] .bob{animation:breathe 2.6s ease-in-out infinite}
[data-state="idle"] .head{animation:headTilt 3.4s ease-in-out infinite}
[data-state="idle"] .arm.l{animation:armSwayL 2.6s ease-in-out infinite}
[data-state="idle"] .arm.r{animation:armSwayR 2.6s ease-in-out infinite}

[data-state="run"] .bob{animation:runBob .34s ease-in-out infinite}
[data-state="run"] .leg.l{animation:legRun .68s ease-in-out infinite}
[data-state="run"] .leg.r{animation:legRun .68s ease-in-out -.34s infinite}
[data-state="run"] .arm.l{animation:armRunL .68s ease-in-out infinite}
[data-state="run"] .arm.r{animation:armRunR .68s ease-in-out -.34s infinite}
[data-state="run"] .head{animation:headBob .34s ease-in-out infinite}
[data-state="run"] .t-shadow{animation:shadowRun .34s ease-in-out infinite}

[data-state="jump"] .jumper{animation:jump .8s cubic-bezier(.3,.7,.4,1)}
[data-state="jump"] .t-shadow{animation:shadowJump .8s ease-in-out}
[data-state="jump"] .arm.l{animation:armUpL .8s ease-in-out}
[data-state="jump"] .arm.r{animation:armUpR .8s ease-in-out}
[data-state="jump"] .leg.l{animation:legStarL .8s ease-in-out}
[data-state="jump"] .leg.r{animation:legStarR .8s ease-in-out}

[data-state="dance"] .bob{animation:danceBob .6s ease-in-out infinite alternate}
[data-state="dance"] .arm.l{animation:armDanceL .6s ease-in-out infinite alternate}
[data-state="dance"] .arm.r{animation:armDanceR .6s ease-in-out infinite alternate}
[data-state="dance"] .leg.l{animation:legDanceL .3s ease-in-out infinite alternate}
[data-state="dance"] .leg.r{animation:legDanceR .3s ease-in-out infinite alternate}
[data-state="dance"] .head{animation:headDance .6s ease-in-out infinite alternate}

[data-state="cheer"] .jumper{animation:hop .5s ease-in-out infinite}
[data-state="cheer"] .arm.l{animation:armCheerL .25s ease-in-out infinite alternate}
[data-state="cheer"] .arm.r{animation:armCheerR .25s ease-in-out infinite alternate}
[data-state="cheer"] .t-shadow{animation:shadowJump .5s ease-in-out infinite}

[data-state="wave"] .bob{animation:breathe 2.6s ease-in-out infinite}
[data-state="wave"] .arm.r{animation:waveArm .45s ease-in-out infinite alternate}
[data-state="wave"] .arm.l{animation:armSwayL 2.6s ease-in-out infinite}
[data-state="wave"] .head{animation:headTilt 1.6s ease-in-out infinite}

[data-state="spin"] .jumper{transform-origin:100px 170px;animation:spinFlip .95s cubic-bezier(.4,.1,.3,1)}
[data-state="spin"] .arm.l{transform:rotate(115deg)}
[data-state="spin"] .arm.r{transform:rotate(-115deg)}

[data-state="surprise"] .jumper{animation:popS .6s cubic-bezier(.3,1.5,.5,1)}
[data-state="surprise"] .eyes{animation:none;transform:scale(1.18)}
[data-state="surprise"] .brows{transform:translateY(-8px)}
[data-state="surprise"] .arm.l{transform:rotate(55deg);transition:transform .15s}
[data-state="surprise"] .arm.r{transform:rotate(-55deg);transition:transform .15s}

[data-state="run"] .m-open,[data-state="jump"] .m-open,[data-state="dance"] .m-open,[data-state="cheer"] .m-open{opacity:1;transform:scaleY(.8)}
[data-state="surprise"] .m-open{opacity:1;transform:scale(.7,1)}
[data-state="run"] .m-smile,[data-state="jump"] .m-smile,[data-state="dance"] .m-smile,[data-state="cheer"] .m-smile,[data-state="surprise"] .m-smile,[data-talk="1"] .m-smile{opacity:0}
[data-talk="1"] .m-open{opacity:1;animation:talkM .26s ease-in-out infinite alternate}


[data-state="eat"] .head{animation:chewHead .32s ease-in-out infinite alternate}
[data-state="eat"] .eyes{animation:none;transform:scaleY(.45)}
[data-state="eat"] .m-open{opacity:1;animation:chewM .32s ease-in-out infinite alternate}
[data-state="eat"] .m-smile{opacity:0}
[data-state="eat"] .cheek{animation:cheek .32s ease-in-out infinite alternate}
[data-state="eat"] .bob{animation:breathe 1s ease-in-out infinite}
.cheek.l{transform-origin:60px 123px}.cheek.r{transform-origin:140px 123px}

/* ---------- counter ---------- */
.board{position:relative;z-index:3;margin-top:-14px;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--counter),var(--counter2));border-radius:34px 34px 0 0;box-shadow:0 -5px 0 rgba(255,255,255,.7),0 -12px 30px rgba(59,47,99,.14)}
.board.busy{pointer-events:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:clamp(50px,7.5vh,64px);background:#fff;border-radius:20px;font-size:clamp(13px,3.5vw,18px);font-weight:800;line-height:1.05;box-shadow:0 4px 0 rgba(59,47,99,.14);transition:transform .12s,background .2s}
.tab .em{font-size:clamp(20px,5.6vw,30px);line-height:1.1}
.tab[aria-selected="true"]{background:var(--tomato);color:#fff;transform:translateY(-2px);box-shadow:0 6px 0 #d4452f}
.work{position:relative;flex:1;min-height:0;container-type:size;display:grid;place-items:center;background:#fff;border-radius:26px;box-shadow:inset 0 0 0 5px #efe9ff,0 4px 0 rgba(59,47,99,.1);overflow:hidden}
.reset{position:absolute;z-index:6;top:8px;inset-inline-end:8px;width:36px;height:36px;border-radius:50%;background:#f3eeff;display:grid;place-items:center}
.reset svg{width:20px;height:20px}
.tools{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;transition:opacity .3s}
.tools.off{opacity:.35;pointer-events:none}
.tool{width:clamp(40px,11vw,56px);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;border:3px solid transparent;box-shadow:0 4px 0 rgba(59,47,99,.16);font-size:clamp(22px,6.4vw,32px);line-height:1;transition:transform .12s}
.tool:active{transform:translateY(3px)}
.tool[aria-pressed="true"]{border-color:var(--tomato);transform:scale(1.1)}
.tool svg{width:72%;height:72%}
.tool .lay{font-size:4.2px;margin:0!important}
.sep{width:2px;height:30px;background:rgba(59,47,99,.18);border-radius:2px}
.go{flex:none;height:clamp(46px,6.8vh,56px);border-radius:999px;background:var(--mint);color:#fff;font-size:clamp(20px,5.4vw,26px);font-weight:800;padding-top:3px;text-shadow:0 2px 0 rgba(0,0,0,.15);box-shadow:0 6px 0 #2a9c78;transition:transform .1s}
.go.hot{background:var(--tomato);box-shadow:0 6px 0 #d4452f}
.go:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.go:disabled{opacity:.45;box-shadow:none;cursor:default}
.ftxt{position:absolute;z-index:7;left:50%;top:36%;font-size:clamp(26px,8vw,40px);font-weight:800;color:var(--tomato);-webkit-text-stroke:6px #fff;paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:burst 1.3s ease-out forwards}

/* pizza */
.plate{position:relative;width:88cqmin;height:88cqmin;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #efe9ff,0 9px 0 rgba(59,47,99,.1);display:grid;place-items:center}
.pizza{width:92%;height:92%;touch-action:none;transition:filter 2.4s;cursor:crosshair}
.pizza.baked{filter:sepia(.4) saturate(1.35) brightness(.94)}
.g-cuts{transition:opacity 1s}
.pop{transform-box:fill-box;transform-origin:center;animation:popIn .28s cubic-bezier(.3,1.8,.5,1)}
.oven{position:absolute;inset:-5%;border-radius:50%;background:radial-gradient(circle,rgba(255,179,71,.72),rgba(255,107,87,.82));opacity:0;pointer-events:none;transition:opacity .3s;display:grid;place-items:center;font-size:clamp(22px,6vw,32px);color:#fff;text-shadow:0 2px 0 #b2321f}
.oven.on{opacity:1;animation:heat .8s ease-in-out infinite alternate}

/* burger */
.burger{display:flex;flex-direction:column-reverse;align-items:center;font-size:16px;transition:font-size .3s}
.lay{flex:none;position:relative;width:13em}
.lay.new{animation:dropIn .45s cubic-bezier(.3,1.4,.5,1)}
.bun-b{height:2.2em;background:#f1b45c;border-radius:.6em .6em 2em 2em;box-shadow:inset 0 -.4em 0 #d89438}
.patty{height:1.9em;margin-top:-.25em;background:#7a4a32;border-radius:1em;box-shadow:inset 0 -.35em 0 #5f3825;width:13.4em}
.cheese{height:1.1em;margin-top:-.3em;background:#ffd23f;clip-path:polygon(0 0,100% 0,100% 45%,88% 100%,76% 45%,30% 45%,18% 100%,6% 45%,0 45%);width:13.6em}
.lettuce{height:1.4em;margin-top:-.35em;background:#69d05f;border-radius:.8em;box-shadow:inset 0 -.3em 0 #4fb347;width:14em}
.tomato{height:1.2em;margin-top:-.3em;background:#ff5c4d;border-radius:.7em;box-shadow:inset 0 -.25em 0 #d93f31;width:12.8em}
.onion{height:.9em;margin-top:-.2em;background:#f1d6ff;border-radius:.5em;box-shadow:inset 0 -.2em 0 #d7a8f0;width:12em}
.pickle{height:.9em;margin-top:-.2em;background:#7ac143;border-radius:.5em;width:12.5em}
.sauce{height:.8em;margin-top:-.2em;background:#e53935;border-radius:.5em;width:12em}
.bun-t{height:3.3em;margin-top:-.3em;background:radial-gradient(ellipse .3em .17em at 22% 38%,#fff6d8 98%,transparent),radial-gradient(ellipse .3em .17em at 50% 24%,#fff6d8 98%,transparent),radial-gradient(ellipse .3em .17em at 77% 40%,#fff6d8 98%,transparent),radial-gradient(ellipse .3em .17em at 36% 62%,#fff6d8 98%,transparent),radial-gradient(ellipse .3em .17em at 64% 66%,#fff6d8 98%,transparent),#f1b45c;border-radius:50% 50% 1.2em 1.2em/100% 100% 1.2em 1.2em;box-shadow:inset -.5em -.3em 0 #d89438}

/* juice */
.jwrap{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:5%;width:96cqw;height:92cqh}
.blender{height:100%;width:auto;overflow:visible}
.cup{height:78%;width:auto;overflow:visible}
.jar{transform-origin:80px 188px;transition:transform .6s ease-in-out}
.jar.tilt{transform:rotate(-38deg)}
.jar.shake{animation:jshake .1s linear infinite alternate}
.liq{transition:transform 1.1s ease-in}
.liq.drain{transform:translateY(172px)}
.band{transform-box:fill-box;transform-origin:bottom;animation:bandIn .5s ease-out;transition:fill .9s}
.fdrop{position:absolute;z-index:4;font-size:clamp(26px,8vw,40px);line-height:1;pointer-events:none}

/* ice cream */
.ice{height:96%;width:auto;overflow:visible}
.ice.wob{transform-origin:50% 92%;animation:iceWob 1s ease-in-out infinite alternate}
.scoop.new{animation:scoopIn .5s cubic-bezier(.3,1.5,.5,1)}

#fx{position:absolute;inset:0;z-index:40;pointer-events:none;width:100%;height:100%}

@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes rise{from{transform:translateY(130%)}to{transform:none}}
@keyframes burst{from{transform:translate(-50%,0) scale(.5) rotate(var(--r,-6deg));opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1) rotate(var(--r,-6deg))}to{transform:translate(-50%,-74px) scale(1) rotate(var(--r,-6deg));opacity:0}}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes heat{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes dropIn{from{transform:translateY(-4em) scale(1.1);opacity:0}to{transform:none;opacity:1}}
@keyframes jshake{from{transform:translateX(-4px) rotate(-2.5deg)}to{transform:translateX(4px) rotate(2.5deg)}}
@keyframes bandIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes scoopIn{from{transform:translateY(-150px)}60%{transform:translateY(8px)}to{transform:none}}
@keyframes iceWob{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
@keyframes chewHead{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(2px)}}
@keyframes chewM{from{transform:scaleY(.15)}to{transform:scaleY(.7)}}
@keyframes cheek{from{transform:scale(1)}to{transform:scale(1.28)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
@keyframes headTilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes armSwayL{0%,100%{transform:rotate(4deg)}50%{transform:rotate(10deg)}}
@keyframes armSwayR{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-10deg)}}
@keyframes runBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes legRun{0%,100%{transform:rotate(-32deg) translateY(0)}25%{transform:rotate(0) translateY(-9px)}50%{transform:rotate(32deg) translateY(0)}75%{transform:rotate(0) translateY(-9px)}}
@keyframes armRunL{0%,100%{transform:rotate(15deg)}50%{transform:rotate(80deg)}}
@keyframes armRunR{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(-80deg)}}
@keyframes headBob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes shadowRun{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes shadowJump{0%,100%{transform:scale(1);opacity:1}45%,60%{transform:scale(.55);opacity:.6}}
@keyframes jump{0%{transform:scale(1,1)}14%{transform:scale(1.12,.84)}38%{transform:translateY(-84px) scale(.94,1.08)}62%{transform:translateY(-84px) scale(.96,1.05)}86%{transform:translateY(0) scale(1.14,.84)}100%{transform:scale(1,1)}}
@keyframes armUpL{0%,14%{transform:rotate(8deg)}38%,62%{transform:rotate(150deg)}100%{transform:rotate(8deg)}}
@keyframes armUpR{0%,14%{transform:rotate(-8deg)}38%,62%{transform:rotate(-150deg)}100%{transform:rotate(-8deg)}}
@keyframes legStarL{0%,14%{transform:rotate(0)}38%,62%{transform:rotate(24deg)}100%{transform:rotate(0)}}
@keyframes legStarR{0%,14%{transform:rotate(0)}38%,62%{transform:rotate(-24deg)}100%{transform:rotate(0)}}
@keyframes danceBob{0%{transform:rotate(-7deg) translateY(0)}100%{transform:rotate(7deg) translateY(-12px)}}
@keyframes armDanceL{0%{transform:rotate(155deg)}100%{transform:rotate(45deg)}}
@keyframes armDanceR{0%{transform:rotate(-45deg)}100%{transform:rotate(-155deg)}}
@keyframes legDanceL{0%{transform:rotate(-8deg)}100%{transform:rotate(16deg)}}
@keyframes legDanceR{0%{transform:rotate(-16deg)}100%{transform:rotate(8deg)}}
@keyframes headDance{0%{transform:rotate(-10deg)}100%{transform:rotate(10deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.05,.95)}50%{transform:translateY(-30px) scale(.97,1.04)}}
@keyframes armCheerL{0%{transform:rotate(138deg)}100%{transform:rotate(168deg)}}
@keyframes armCheerR{0%{transform:rotate(-138deg)}100%{transform:rotate(-168deg)}}
@keyframes waveArm{0%{transform:rotate(-135deg)}100%{transform:rotate(-172deg)}}
@keyframes spinFlip{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-64px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes popS{0%{transform:scale(1)}30%{transform:scale(1.14,.9)}60%{transform:scale(.94,1.12) translateY(-14px)}100%{transform:scale(1)}}
@keyframes talkM{from{transform:scaleY(.3)}to{transform:scaleY(1)}}


@media (min-width:860px) and (min-height:520px){
  :root{--tw:clamp(180px,34vh,320px)}
  #kitchen{grid-template-rows:none;grid-template-columns:minmax(300px,38%) minmax(0,1fr)}
  .board{margin:6px 12px 12px 0;border-radius:34px;box-shadow:0 12px 30px rgba(59,47,99,.14)}
  .bwrap{margin-bottom:-18px}
}
@media (max-height:520px){.top{height:46px;padding:4px 10px}.pill{height:34px}.brand-badge{width:30px;height:30px}.brand-name{font-size:19px}}
@media (prefers-reduced-motion:reduce){.wish .em,.ice.wob,.oven.on{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">

/* ================= confetti ================= */
const fxCanvas = $('#fx'), fctx = fxCanvas.getContext('2d');
let parts = [], fxRaf = 0;
function sizeFx() { const d = window.devicePixelRatio || 1; fxCanvas.width = innerWidth * d; fxCanvas.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
function confetti(x, y, n = 44) {
  const cols = ['#ff5fa2', '#ffd23f', '#3fa7ff', '#46d3a2', '#8f7bff', '#ff9a3d'];

  if (!fxRaf) fxRaf = requestAnimationFrame(fxLoop);
}
function fxLoop() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    fctx.save(); fctx.globalAlpha = Math.min(1, p.life / 25); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c;

}

</g></g></g></svg>`;
const Talal = (() => {
  const el = $('#talal'); el.innerHTML = TALAL_SVG;
  let st = 'idle', tm = 0;
  const set = s => { st = s; el.dataset.state = s; };
  return {
    el, state: () => st,
    talk: on => { el.dataset.talk = on ? '1' : '0'; },

/* ================= words (speech bubble + bursts) ================= */
const bubble = $('#bubble'), bText = $('#bText'), area = $('#talArea');
let bTimer = 0, bReveal = 0;
function say(text, { ms = 3600 } = {}) {
  clearTimeout(bTimer); clearInterval(bReveal);
  const words = text.split(' '); let i = 0;
  bText.textContent = ''; bubble.classList.add('show'); Talal.talk(true);
  bReveal = setInterval(() => {
    i++; bText.textContent = words.slice(0, i).join(' ');
    if (i >= words.length) { clearInterval(bReveal); Talal.talk(false); }
  }, 120);
  bTimer = setTimeout(() => { bubble.classList.remove('show'); Talal.talk(false); }, ms + words.length * 120);
}
function burst(text) {
  const tr = Talal.el.getBoundingClientRect(), ar = area.getBoundingClientRect();
  const s = document.createElement('span'); s.className = 'burst'; s.textContent = text;
  s.style.left = (tr.left - ar.left + tr.width * rnd(.5, .85)) + 'px';
  s.style.top = (tr.top - ar.top + tr.height * .38) + 'px';
  s.style.setProperty('--r', rnd(-10, 10) + 'deg');
  area.appendChild(s); setTimeout(() => s.remove(), 1400);
}

/* ================= decor ================= */
(() => {
  const cols = ['#ff6b57', '#ffd86b', '#4aa8ff', '#ff8fb1', '#3fc79a', '#b9a8ff'];
  const y = x => { const t = x / 700; return (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * 30 + t * t * 6; };
  let flags = '';
  for (let i = 0; i < 14; i++) { const x = 25 + i * 50, yy = y(x); flags += `<polygon points="${x - 14},${yy} ${x + 14},${yy} ${x},${yy + 26}" fill="${cols[i % cols.length]}"/>`; }
  $('#garland').innerHTML = `<svg viewBox="0 0 700 44" preserveAspectRatio="none" width="100%" height="100%"><path d="M0 6Q350 30 700 6" fill="none" stroke="#ffffffcc" stroke-width="3"/>${flags}</svg>`;
})();

/* ================= hunger, wishes, meals ================= */

let fed = 0, wish = 'pizza', meals = 0;
try { meals = Number(localStorage.getItem('talalMeals')) || 0; } catch (e) {}
$('#mealCount').textContent = AR(meals);
$('#segs').innerHTML = '<i class="seg"></i>'.repeat(5);

function setWish(k) { wish = k; $('#wish').innerHTML = `<span>طلال يريد</span><span class="em">${FOODS[k].em}</span>`; }
setWish(pickOne(Object.keys(FOODS)));

const POST = {
  pizza: ['ممم! أفضل بيتزا في العالم!', 'جبنها مطاطي! أحبها!', 'أريد شريحة ثانية!'],

  juice: ['منعش جداً! شكراً!', 'لذيذ! أعد لي كأساً!', 'عصير سحري!'],

};
const BURST = { pizza: ['نَم نَم!', 'ممم!'], burger: ['كرنش!', 'نَم نَم نَم!'], juice: ['سلورب!', 'غلوب غلوب!'], ice: ['شلوب شلوب!', 'برررد!'] };
const IDLE = ['بطني يقرقر... غرررر!', 'هل ستطبخ لي شيئاً قريباً؟', 'أنا جائع جداً!', 'أشم رائحة طعام لذيذ!'];
const TICKLE = [
  { s: 'jump', ms: 850, t: 'هيييه! قفزة كبيرة!' }, { s: 'spin', ms: 950, t: 'شوف! أنا أدور وأدور!' },
  { s: 'dance', ms: 2400, t: 'هههه! دغدغتني!' }, { s: 'surprise', ms: 800, t: 'لا تضغط على بطني! أنا جائع!' },
  { s: 'wave', ms: 2000, t: 'أهلاً! هل الطعام جاهز؟' }, { s: 'cheer', ms: 1800, t: 'أحب المطبخ! أحب الطعام!' }
];

/* ================= feeding ================= */
const board = $('#board'), work = $('#work'), tools = $('#tools'), go = $('#go'), tabsEl = $('#tabs');
let busy = false, cur = 'pizza';

function floatText(t) {
  const s = document.createElement('span'); s.className = 'ftxt'; s.textContent = t; s.style.setProperty('--r', rnd(-8, 8) + 'deg');
  work.appendChild(s); setTimeout(() => s.remove(), 1400);
}
function setGo(label, fn, { hot = false, disabled = false } = {}) { go.textContent = label; go.onclick = fn; go.disabled = disabled; go.classList.toggle('hot', hot); }

async function feed(node, kind, pre) {
  if (busy) return; busy = true; board.classList.add('busy'); clearPending();
  say(pre, { ms: 2200 });
  const r = node.getBoundingClientRect();
  const clone = node.cloneNode(true);
  clone.removeAttribute('id');
  Object.assign(clone.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: '0', zIndex: '30', pointerEvents: 'none', transformOrigin: '50% 50%' });
  document.body.appendChild(clone); node.style.visibility = 'hidden';
  const tr = Talal.el.getBoundingClientRect();
  const dx = tr.left + tr.width / 2 - (r.left + r.width / 2), dy = tr.top + tr.height * .45 - (r.top + r.height / 2);
  try {
    const a = clone.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx * .55}px,${dy * .55 - 90}px) scale(.62) rotate(-12deg)`, opacity: 1, offset: .55 },
      { transform: `translate(${dx}px,${dy}px) scale(.1) rotate(-30deg)`, opacity: .9 }
    ], { duration: 1000, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' });
    await Promise.race([a.finished, sleep(1150)]);
  } catch (e) { await sleep(1000); }
  clone.remove();

  Talal.play('eat', 2700);
  burst(pickOne(BURST[kind])); setTimeout(() => burst(pickOne(BURST[kind])), 800); setTimeout(() => burst('ممم!'), 1500);
  const hit = kind === wish;
  setTimeout(() => say(hit ? 'هذا ما أردته بالضبط! شكراً!' : pickOne(POST[kind]), { ms: 2200 }), 600);
  meals++; $('#mealCount').textContent = AR(meals);
  const mp = $('#mealPill'); mp.classList.remove('pulse'); void mp.offsetWidth; mp.classList.add('pulse');
  try { localStorage.setItem('talalMeals', String(meals)); } catch (e) {}
  fed = Math.min(5, fed + (hit ? 2 : 1)); renderMeter();
  if (hit) { confetti(innerWidth / 2, innerHeight * .3, 50); let n; do { n = pickOne(Object.keys(FOODS)); } while (n === kind); setWish(n); }
  await sleep(2800);
  if (fed >= 5) {
    Talal.play('dance', 4200); burst('عخخخ!'); confetti(innerWidth / 2, innerHeight * .3, 120);
    say('شبعت! شكراً لك يا طاهي!', { ms: 3000 });
    await sleep(4300); fed = 0; renderMeter(); say('...لكن عندي مكان للحلوى!', { ms: 2600 });
  }
  openGame(cur, { silent: true }); busy = false; board.classList.remove('busy');
}

function buildPizza() {
  let sel = 'sauce', baked = false, baking = false, down = false, last = null; const n = { top: 0, sauce: 0, cheese: 0 };
  work.innerHTML = `<div class="plate"><svg class="pizza" viewBox="0 0 300 300" aria-label="بيتزا"><circle cx="150" cy="150" r="126" fill="#efbb6a"/><circle cx="150" cy="150" r="110" fill="#f8dca0"/><g class="g-sauce"></g><g class="g-cheese"></g><g class="g-top"></g><g class="g-spots"></g><g class="g-cuts" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round" opacity="0">${[0, 1, 2, 3].map(i => `<line x1="150" y1="34" x2="150" y2="266" transform="rotate(${i * 45} 150 150)"/>`).join('')}</g></svg><div class="oven"><span>يخبز...</span></div></div>`;
  addReset();
  const svg = $('.pizza', work), gS = $('.g-sauce', work), gC = $('.g-cheese', work), gT = $('.g-top', work), oven = $('.oven', work);
  const pt = e => { const r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 300, y: (e.clientY - r.top) / r.height * 300 }; };
  const inside = (p, R) => Math.hypot(p.x - 150, p.y - 150) <= R;
  const place = p => {
    if (baked || baking || busy) return;
    if (sel === 'sauce') { if (!inside(p, 88)) return; gS.insertAdjacentHTML('beforeend', `<circle cx="${p.x}" cy="${p.y}" r="${rnd(16, 22)}" fill="#e0342c" opacity=".94"/>`); n.sauce++; }
    else if (sel === 'cheese') { if (!inside(p, 96)) return; gC.insertAdjacentHTML('beforeend', `<circle cx="${p.x + rnd(-4, 4)}" cy="${p.y + rnd(-4, 4)}" r="${rnd(9, 14)}" fill="#ffd23f" stroke="#f0b400" stroke-width="1.5"/>`); n.cheese++; }
    else { if (!inside(p, 100) || n.top >= 16) return; const rot = sel === 'mushroom' ? rnd(-25, 25) : rnd(0, 360); gT.insertAdjacentHTML('beforeend', `<g transform="translate(${p.x} ${p.y}) rotate(${rot})"><g class="pop">${TOP[sel]}</g></g>`); n.top++; }
    go.disabled = false;
  };
  svg.addEventListener('pointerdown', e => { down = true; const p = pt(e); place(p); last = p; });
  svg.addEventListener('pointermove', e => { if (!down || (sel !== 'sauce' && sel !== 'cheese')) return; const p = pt(e); if (last && Math.hypot(p.x - last.x, p.y - last.y) < 10) return; place(p); last = p; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => svg.addEventListener(ev, () => { down = false; }));
  [['sauce', 'صلصة'], ['cheese', 'جبن'], ['pepperoni', 'بيبروني'], ['mushroom', 'فطر'], ['olive', 'زيتون'], ['pepper', 'فلفل']].forEach(([k, l], i) => {
    const b = mkTool(ICON[k], l, b => { sel = k; selectTool(b); }, true); if (i === 0) b.setAttribute('aria-pressed', 'true');
  });
  const serve = () => {
    const pre = (!n.sauce && !n.cheese && !n.top) ? 'هذا مجرد عجين! لكن... حسناً!' : n.top >= 8 ? 'واو! بيتزا مليئة بالإضافات!' : (n.sauce && n.cheese) ? 'صلصة وجبن! بيتزا كلاسيكية!' : 'بيتزا! أنا جائع!';
    feed(svg, 'pizza', pre);
  };
  const bake = () => {
    if (baking || baked) return; baking = true; tools.classList.add('off'); go.disabled = true; oven.classList.add('on');
    say('الفرن يعمل... أنا أنتظر بفارغ الصبر!', { ms: 2400 });
    later(() => {
      oven.classList.remove('on'); svg.classList.add('baked');
      $('.g-spots', work).innerHTML = Array.from({ length: 14 }, () => { const a = rnd(0, 6.28), r = rnd(10, 92); return `<circle cx="${150 + Math.cos(a) * r}" cy="${150 + Math.sin(a) * r}" r="${rnd(3, 6)}" fill="#d58a2b" opacity=".45"/>`; }).join('');
      $('.g-cuts', work).setAttribute('opacity', '1'); baked = true; baking = false;
      floatText('دينغ! جاهزة!'); Talal.play('cheer', 1400); setGo('قدّم لطلال', serve);
    }, 2800);
  };
  setGo('اخبز!', bake, { hot: true, disabled: true });
}

/* ================= burger ================= */
function buildBurger() {
  const H = { 'bun-b': 2.2, patty: 1.9, cheese: .9, lettuce: 1.3, tomato: 1.1, onion: .8, pickle: .8, sauce: .7, 'bun-t': 3.3 };
  const NAMES = { patty: 'لحم', cheese: 'جبن', lettuce: 'خس', tomato: 'طماطم', onion: 'بصل', pickle: 'مخلل', sauce: 'صلصة' };
  let layers = [], closed = false;
  work.innerHTML = '<div class="burger"><div class="lay bun-b"></div></div>'; addReset();
  const burger = $('.burger', work);
  const refit = () => { const em = H['bun-b'] + H['bun-t'] + layers.reduce((a, k) => a + H[k], 0); burger.style.fontSize = clamp(work.clientHeight * .84 / em, 6, 16) + 'px'; };
  requestAnimationFrame(refit);
  const add = k => {
    if (closed) return;
    if (layers.length >= 8) { say('كفى! سينهار البرجر!', { ms: 2200 }); Talal.play('surprise', 700); return; }
    layers.push(k); const d = document.createElement('div'); d.className = 'lay new ' + k; burger.appendChild(d); refit();
    if (layers.length === 5) say('ارتفع كثيراً! ما شاء الله!', { ms: 2200 });
  };
  const CHIP = { patty: '#7a4a32', cheese: '#ffd23f', lettuce: '#69d05f', tomato: '#ff5c4d', onion: '#f1d6ff', pickle: '#7ac143', sauce: '#e53935' };
  Object.keys(NAMES).forEach(k => mkTool(`<span style="display:block;width:68%;height:40%;border-radius:12px;background:${CHIP[k]};box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)"></span>`, NAMES[k], () => add(k)));
  const serve = () => {
    const pre = !layers.includes('patty') ? 'برجر بدون لحم؟! حسناً...' : layers.length >= 6 ? 'ضخم! كيف سآكله؟!' : 'برجر شهي!';
    feed(burger, 'burger', pre);
  };
  const close = () => {
    if (closed) return; closed = true; const d = document.createElement('div'); d.className = 'lay new bun-t'; burger.appendChild(d); refit();
    tools.classList.add('off'); Talal.play('cheer', 1200); say('أغلقته! جاهز للأكل!', { ms: 1800 }); setGo('قدّم لطلال', serve);
  };
  setGo('أغلق البرجر', close, { hot: true });
}

/* ================= juice ================= */
function buildJuice() {
  const F = [['🍓', [255, 95, 126]], ['🍌', [255, 222, 110]], ['🍊', [255, 160, 50]], ['🍇', [150, 100, 215]], ['🥝', [130, 205, 75]], ['🍉', [255, 110, 140]]];
  let chosen = [], phase = 'fill';
  work.innerHTML = `<div class="jwrap" id="jw">
    <svg class="blender" viewBox="0 0 160 260" aria-label="خلاط"><defs><clipPath id="jc"><path d="M30 28H130L118 174Q116 188 102 188H58Q44 188 42 174Z"/></clipPath></defs>
      <g class="jar"><g clip-path="url(#jc)"><g class="liq"></g></g>
        <path d="M30 28H130L118 174Q116 188 102 188H58Q44 188 42 174Z" fill="#dff2ff" fill-opacity=".35" stroke="#8fa8d8" stroke-width="5" stroke-linejoin="round"/>
        <path d="M45 46L52 168" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"/>
        <rect x="24" y="12" width="112" height="18" rx="9" fill="#6c5ce0" stroke="#4b3fb5" stroke-width="3"/></g>
      <rect x="30" y="186" width="100" height="62" rx="16" fill="#7d6cf0" stroke="#4b3fb5" stroke-width="3"/><circle cx="62" cy="217" r="7" fill="#ffd86b"/><circle cx="98" cy="217" r="7" fill="#ff8fb1"/></svg>
    <svg class="cup" viewBox="0 0 120 210" aria-label="كأس"><defs><clipPath id="cc"><path d="M16 50H104L95 188Q94 200 82 200H38Q26 200 25 188Z"/></clipPath></defs>
      <g clip-path="url(#cc)"><rect class="cl" x="10" y="50" width="100" height="150" style="fill:#ddd;transform:translateY(165px);transition:transform 1.2s ease-out"/></g>
      <path d="M16 50H104L95 188Q94 200 82 200H38Q26 200 25 188Z" fill="#dff2ff" fill-opacity=".3" stroke="#8fa8d8" stroke-width="5" stroke-linejoin="round"/>
      <g transform="rotate(12 84 40)"><rect x="79" y="-8" width="9" height="124" rx="4.5" fill="#ff6b57"/><rect x="79" y="10" width="9" height="8" fill="#fff" opacity=".85"/><rect x="79" y="34" width="9" height="8" fill="#fff" opacity=".85"/><rect x="79" y="58" width="9" height="8" fill="#fff" opacity=".85"/></g>
      <rect x="12" y="44" width="96" height="10" rx="5" fill="#fff" stroke="#8fa8d8" stroke-width="3"/></svg></div>`;
  addReset();
  const jw = $('#jw', work), jar = $('.jar', work), liq = $('.liq', work), cl = $('.cl', work), bl = $('.blender', work);
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const avg = () => { const s = chosen.reduce((a, c) => [a[0] + c[0], a[1] + c[1], a[2] + c[2]], [0, 0, 0]); return s.map(v => Math.round(v / chosen.length)); };
  F.forEach(([e, c]) => mkTool(e, 'فاكهة', () => {
    if (phase !== 'fill') return;
    if (chosen.length >= 5) { say('الخلاط ممتلئ! لنخلط!', { ms: 2000 }); return; }
    chosen.push(c); const i = chosen.length - 1;
    const jr = bl.getBoundingClientRect(), wr = jw.getBoundingClientRect(), d = document.createElement('span');
    d.className = 'fdrop'; d.textContent = e; d.style.left = (jr.left + jr.width / 2 - wr.left - 16) + 'px'; d.style.top = (jr.top - wr.top - 10) + 'px'; jw.appendChild(d);
    try { d.animate([{ transform: 'translateY(-30px) scale(1.2)', opacity: 1 }, { transform: `translateY(${jr.height * .35}px) scale(.8)`, opacity: 0 }], { duration: 480, easing: 'ease-in', fill: 'forwards' }); } catch (er) {}
    later(() => { d.remove(); liq.insertAdjacentHTML('beforeend', `<rect class="band" x="30" y="${188 - 32 * (i + 1)}" width="100" height="33" style="fill:${rgb(c)}"/>`); go.disabled = false; }, 450);
  }));
  const serve = () => feed($('.cup', work), 'juice', chosen.length >= 4 ? 'خلطة غريبة! لكن سأجربها!' : 'عصير! أنا عطشان!');
  const pour = () => {
    if (phase !== 'pour') return; phase = 'poured'; go.disabled = true; cl.style.fill = rgb(avg());
    jar.classList.add('tilt'); later(() => { liq.classList.add('drain'); cl.style.transform = 'translateY(26px)'; }, 500);
    later(() => { jar.classList.remove('tilt'); setGo('قدّم لطلال', serve); floatText('جاهز!'); Talal.play('cheer', 1200); }, 1800);
  };
  const blend = () => {
    if (phase !== 'fill' || !chosen.length) return; phase = 'blend'; go.disabled = true; tools.classList.add('off');
    jar.classList.add('shake'); floatText('ززززز!'); say('الخلاط يدور! أنا متحمس!', { ms: 1800 });
    later(() => { liq.querySelectorAll('.band').forEach(b => { b.style.fill = rgb(avg()); }); }, 600);
    later(() => { jar.classList.remove('shake'); phase = 'pour'; setGo('اسكب في الكأس', pour, { hot: true }); }, 1900);
  };
  setGo('اخلط!', blend, { hot: true, disabled: true });
}

/* ================= ice cream ================= */
function buildIce() {
  const FL = [['#ff9ec7', '#ffc9e0'], ['#fff0c2', '#fffae8'], ['#8a5a44', '#ad7a60'], ['#8fe3c1', '#bcf2da'], ['#ffc857', '#ffe296'], ['#a58bff', '#cbbdff']];
  let count = 0;
  work.innerHTML = `<svg class="ice" viewBox="0 -110 200 420" aria-label="آيس كريم"><defs><clipPath id="cone"><path d="M54 172L146 172L100 304Z"/></clipPath></defs>
    <path d="M54 172L146 172L100 304Z" fill="#e8b068" stroke="#c98d3f" stroke-width="3" stroke-linejoin="round"/>
    <g clip-path="url(#cone)" stroke="#c98d3f" stroke-width="2.5" opacity=".8">${[0, 1, 2, 3, 4].map(i => `<path d="M${30 + i * 26} 160L${110 + i * 26} 320M${170 - i * 26} 160L${90 - i * 26} 320"/>`).join('')}</g>
    <g class="scoops"></g></svg>`;
  addReset();
  const svg = $('.ice', work), sg = $('.scoops', work);
  const scoopSVG = (i, c) => { const cy = 150 - i * 56; return `<g class="scoop new">${[-34, -17, 0, 17, 34].map((dx, k) => `<circle cx="${100 + dx}" cy="${cy + (k % 2 ? 36 : 30)}" r="${k % 2 ? 10 : 11}" fill="${c[0]}"/>`).join('')}<circle cx="100" cy="${cy}" r="44" fill="${c[0]}"/><ellipse cx="84" cy="${cy - 18}" rx="12" ry="7" fill="${c[1]}" opacity=".85" transform="rotate(-25 84 ${cy - 18})"/></g>`; };
  FL.forEach((c, i) => mkTool(`<span style="display:block;width:70%;height:70%;border-radius:50%;background:${c[0]};box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),inset 4px 4px 0 ${c[1]}"></span>`, 'نكهة', () => {
    if (count >= 4) { say('طويل جداً! لن أصل إليه!', { ms: 2000 }); return; }
    sg.insertAdjacentHTML('beforeend', scoopSVG(count, c)); count++; go.disabled = false;
    if (count === 4) { svg.classList.add('wob'); say('سيسقط! أسرع وقدّمه لي!', { ms: 2200 }); Talal.play('surprise', 700); }
  }));
  tools.insertAdjacentHTML('beforeend', '<span class="sep"></span>');
  const deco = kind => {
    if (!count) { say('أضف كرة آيس كريم أولاً!', { ms: 2200 }); return; }
    const cy = 150 - (count - 1) * 56, g = sg.lastElementChild;
    if (kind === 'sprinkles') g.insertAdjacentHTML('beforeend', Array.from({ length: 14 }, () => { const a = rnd(-2.8, -.35), r = rnd(14, 38), x = 100 + Math.cos(a) * r * 1.1, y = cy + Math.sin(a) * r; return `<rect x="${x}" y="${y}" width="9" height="3.6" rx="1.8" fill="${pickOne(['#ff5fa2', '#3fa7ff', '#ffd23f', '#46c8a0', '#ffffff'])}" transform="rotate(${rnd(0, 180)} ${x} ${y})"/>`; }).join(''));
    if (kind === 'syrup') g.insertAdjacentHTML('beforeend', `<path d="M56 ${cy - 4}Q100 ${cy - 70} 144 ${cy - 4}q-6 12 -13 3q-4 16 -11 2q-6 18 -13 0q-6 14 -13 0q-6 12 -14 -2q-6 10 -13 0Z" fill="#5a3426"/>`);
    if (kind === 'cherry') g.insertAdjacentHTML('beforeend', `<path d="M100 ${cy - 46}q8 -18 22 -22" stroke="#4fa34f" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="100" cy="${cy - 44}" r="11" fill="#e0243c"/><circle cx="96" cy="${cy - 48}" r="3" fill="#fff" opacity=".6"/>`);
  };
  mkTool('<svg viewBox="0 0 40 40" aria-hidden="true"><g stroke-linecap="round" stroke-width="5"><path d="M8 12l6-3" stroke="#ff5fa2"/><path d="M24 8l6 4" stroke="#3fa7ff"/><path d="M12 24l7-2" stroke="#ffd23f"/><path d="M26 28l6-5" stroke="#46c8a0"/></g></svg>', 'سكاكر ملونة', () => deco('sprinkles'));
  mkTool('<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 10Q20 2 34 10q-3 7 -6 2q-2 10 -6 2q-3 9 -6 0q-3 8 -6 -1q-3 5 -6 -3Z" fill="#5a3426"/></svg>', 'شوكولاتة سائلة', () => deco('syrup'));
  mkTool('🍒', 'كرز', () => deco('cherry'));
  setGo('قدّم لطلال', () => feed(svg, 'ice', count >= 4 ? 'يا إلهي! طويل جداً!' : count === 1 ? 'كرة واحدة فقط؟ حسناً!' : 'آيس كريم! يا سلام!'), { disabled: true });
}

/* ================= tabs ================= */
const GAMES = {
  pizza: { label: 'بيتزا', em: '🍕', build: buildPizza, hi: 'بيتزا! أحب البيتزا!' },
  burger: { label: 'برجر', em: '🍔', build: buildBurger, hi: 'برجر! يا سلام!' },
  juice: { label: 'عصير', em: '🥤', build: buildJuice, hi: 'عصير! أنا عطشان!' },
  ice: { label: 'آيس كريم', em: '🍦', build: buildIce, hi: 'آيس كريم! أحبه!' }
};
tabsEl.innerHTML = Object.entries(GAMES).map(([k, g]) => `<button class="tab" type="button" role="tab" data-k="${k}" aria-selected="false"><span class="em">${g.em}</span><span>${g.label}</span></button>`).join('');
function openGame(k, { silent = false } = {}) {
  clearPending(); cur = k;
  [...tabsEl.children].forEach(t => t.setAttribute('aria-selected', String(t.dataset.k === k)));
  work.innerHTML = ''; tools.innerHTML = ''; tools.classList.remove('off');
  GAMES[k].build();
  if (!silent) { Talal.play('jump', 850); say(GAMES[k].hi, { ms: 2000 }); }
}
tabsEl.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t && t.dataset.k !== cur) openGame(t.dataset.k); });

/* ================= Talal reactions ================= */
let tq = [];
Talal.el.addEventListener('click', () => {
  if (busy) return; if (!tq.length) tq = shuffle(TICKLE);
  const r = tq.pop(); Talal.play(r.s, r.ms); say(r.t, { ms: 1800 }); burst(pickOne(['هههه!', 'هيه!', 'أوه!']));
});
Talal.el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Talal.el.click(); } });
setInterval(() => {
  if (busy || document.hidden || bubble.classList.contains('show') || Talal.state() !== 'idle') return;
  const t = pickOne(IDLE); say(t, { ms: 3000 }); if (t.includes('غرر')) { burst('غرررر!'); Talal.play('surprise', 700); }
}, 13000);

/* ================= start ================= */
sizeFx(); addEventListener('resize', sizeFx);
openGame('pizza', { silent: true });
Talal.el.classList.add('enter');
setTimeout(() => { Talal.play('wave', 2400); say('أنا جوعان جداً! هل تطبخ لي شيئاً؟', { ms: 4200 }); }, 950);
setTimeout(() => burst('غرررر!'), 1300);
})();
</script>
